<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca · Tamaki Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE9E1;--panel:#FAF8F3;--panel2:#DEDACE;--line:#CBC5B6;--ink:#1B1912;--mute:#6B6556;
  --gold:#D9A300;--gold-ink:#1A1400;--danger:#C2412D;--shade:rgba(0,0,0,.55);
  --o-palco:#D9A300;--o-atriz:#D85C93;--o-voz:#2E8C83;--o-editor:#6A50C9;--o-emulador:#3D6FE0;--o-outro:#6B6556;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110;--panel:#1C1B18;--panel2:#2A2823;--line:#38352E;--ink:#F3EFE3;--mute:#9C9686;
    --gold:#F2B705;--gold-ink:#1A1400;--danger:#E5533D;--shade:rgba(0,0,0,.72);
    --o-palco:#F2B705;--o-atriz:#FF7BB0;--o-voz:#3FB3A8;--o-editor:#8B73E8;--o-emulador:#5F8DF7;--o-outro:#9C9686;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121110;--panel:#1C1B18;--panel2:#2A2823;--line:#38352E;--ink:#F3EFE3;--mute:#9C9686;
  --gold:#F2B705;--gold-ink:#1A1400;--danger:#E5533D;--shade:rgba(0,0,0,.72);
  --o-palco:#F2B705;--o-atriz:#FF7BB0;--o-voz:#3FB3A8;--o-editor:#8B73E8;--o-emulador:#5F8DF7;--o-outro:#9C9686;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{width:20px;height:20px;flex:none}
[hidden]{display:none!important}

.top{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 4px}
.top a{display:flex;align-items:center;gap:2px;color:var(--ink);text-decoration:none;font-size:14px;padding:6px 4px}
.top h1{font-size:17px;font-weight:600}
.top .sp{flex:1}
.addBtn{background:var(--gold);color:var(--gold-ink);border:0;border-radius:6px;padding:8px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:4px}
.addBtn svg{width:18px;height:18px}

.filters{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 10px 8px}
.filters::-webkit-scrollbar{display:none}
.fch{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:none;border-radius:20px;padding:6px 12px;font-size:13px;white-space:nowrap}
.fch i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink))}
.fch b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px}
.fch.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fch.on b{color:inherit;opacity:.7}

.bar{flex:none;display:flex;gap:6px;padding:0 10px 10px;align-items:center}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:8px;padding:0 10px;height:38px;color:var(--mute)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:14px;height:100%}
.search input::placeholder{color:var(--mute)}
.ib{width:38px;height:38px;flex:none;border:0;border-radius:8px;background:var(--panel2);display:grid;place-items:center;color:var(--ink);padding:0}
.ib.on{background:var(--ink);color:var(--bg)}
.ib:disabled{opacity:.35}

.list{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 10px calc(16px + env(safe-area-inset-bottom,0px))}
.day{font-size:12px;color:var(--mute);margin:14px 2px 8px;font-weight:600}
.day:first-child{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.th{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--panel2) center/cover no-repeat;display:grid;place-items:center;color:var(--mute)}
.th svg{width:30px;height:30px}
.th.au{background-color:color-mix(in srgb,var(--c) 18%,var(--panel2));background-size:100% 100%}
.org{position:absolute;left:6px;top:6px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;background:var(--c);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.org.light{color:#1A1400;text-shadow:none}
.dur{position:absolute;right:6px;bottom:6px;font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:rgba(0,0,0,.66);color:#fff;font-variant-numeric:tabular-nums}
.kind{position:absolute;left:6px;bottom:6px;width:22px;height:22px;border-radius:4px;background:rgba(0,0,0,.66);color:#fff;display:grid;place-items:center}
.kind svg{width:14px;height:14px}
.nm{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.meta{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:-3px}
.send{position:absolute;right:6px;top:6px;height:28px;padding:0 9px 0 7px;border-radius:14px;background:rgba(0,0,0,.66);color:#fff;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600}
.send svg{width:15px;height:15px}
.send:active{background:var(--gold);color:var(--gold-ink)}
body.sel .send{display:none}
.chk{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:none;place-items:center;color:var(--gold-ink)}
.chk svg{width:14px;height:14px;opacity:0}
body.sel .chk{display:grid}
.card.on .chk{background:var(--gold);border-color:var(--gold)}
.card.on .chk svg{opacity:1}
.card.on .th{outline:3px solid var(--gold);outline-offset:-3px}

.empty{padding:40px 16px;text-align:center;color:var(--mute);font-size:14px;line-height:1.5;max-width:420px;margin:0 auto}
.empty h2{color:var(--ink);font-size:17px;font-weight:600;margin-bottom:8px}
.empty .addBtn{display:inline-flex;margin-top:16px}
.store{margin:18px 2px 0;font-size:11px;color:var(--mute)}
.store .m{height:4px;border-radius:2px;background:var(--panel2);margin-top:6px;overflow:hidden}
.store .m i{display:block;height:100%;background:var(--gold);width:0}

.pastas{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 10px 8px;align-items:center}
.pastas::-webkit-scrollbar{display:none}
.pch{flex:none;display:flex;align-items:center;gap:6px;border:1.5px dashed var(--line);background:none;border-radius:10px;padding:6px 11px;font-size:13px;white-space:nowrap}
.pch svg{width:15px;height:15px}
.pch b{font-weight:600;color:var(--mute);font-size:12px}
.pch.on{background:var(--gold);color:var(--gold-ink);border:1.5px solid var(--gold)}
.pch.on b{color:inherit;opacity:.7}
.pch.nova{color:var(--gold);border-color:var(--gold)}
.pHead{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 12px}
.pHead h2{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.pHead h2 svg{width:20px;height:20px;color:var(--gold)}
.pHead p{font-size:13px;color:var(--mute);margin-top:2px}
.pHead .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pHead .acts button{border:0;border-radius:6px;padding:8px 11px;font-size:13px;font-weight:600;background:var(--panel2);display:flex;align-items:center;gap:5px}
.pHead .acts button svg{width:15px;height:15px}
.pHead .acts .pri{background:var(--gold);color:var(--gold-ink)}
.pHead .acts .danger{color:var(--danger)}
.rots{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rot{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:13px}
.rot span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rot button{border:0;background:none;color:var(--mute);padding:2px 6px}
.box input[type=text]{width:100%;margin-top:12px;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font-size:15px}
.box .lst{max-height:46vh;overflow:auto;margin-top:12px;display:flex;flex-direction:column;gap:4px}
.box .lst label{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;background:var(--panel2);font-size:14px}
.box .lst small{color:var(--mute);margin-left:auto;font-size:12px}
:root{--o-efeitos:#E0679A}
.selBar{flex:none;display:none;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
body.sel .selBar{display:flex}
.selBar span{flex:1;min-width:40px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selBar .x{padding:8px;background:none}
.selBar button{border:0;border-radius:6px;padding:8px 9px;flex:none;background:var(--panel2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.selBar button svg{width:16px;height:16px}
.selBar .del{color:var(--danger)}
.selBar button:disabled{opacity:.35}
@media (max-width:400px){.selBar button:not(.x) svg{display:none}.selBar button{padding:8px 10px}}

/* visualizador */
#view{position:fixed;inset:0;z-index:30;background:#0d0d0c;color:#F3EFE3;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#view.on{display:flex}
.vHead{height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px}
.vHead button{width:40px;height:40px;border:0;background:none;color:#F3EFE3;display:grid;place-items:center;border-radius:8px}
.vHead input{flex:1;min-width:0;background:none;border:1.5px solid transparent;border-radius:6px;color:#F3EFE3;font-size:15px;font-weight:600;padding:6px 8px}
.vHead input:focus{outline:none;border-color:#F2B705;background:#1a1a18}
.vStage{flex:1 1 0;min-height:0;display:grid;place-items:center;padding:6px;position:relative}
.vStage video,.vStage img{max-width:100%;max-height:100%;display:block;background:#000;border-radius:4px}
.vAudio{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:16px}
.vAudio .wave{width:100%;aspect-ratio:3/1;border-radius:10px;background:#1a1a18 center/100% 100% no-repeat}
.vAudio audio{width:100%}
.vText{width:100%;max-height:22vh;overflow:auto;font-size:14px;line-height:1.5;color:#cfcac0;white-space:pre-wrap;background:#1a1a18;border-radius:8px;padding:10px 12px}
.vInfo{flex:none;text-align:center;font-size:12px;color:#9C9686;padding:4px 12px;font-variant-numeric:tabular-nums}
.vActs{flex:none;display:flex;justify-content:center;gap:0;max-width:560px;width:100%;margin:0 auto;padding:8px 8px 10px;overflow-x:auto;scrollbar-width:none}
.vActs::-webkit-scrollbar{display:none}
.vActs button,.vActs a{flex:1 1 0;min-width:58px;text-align:center;line-height:1.15;border:0;background:none;color:#F3EFE3;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;padding:6px 4px;border-radius:8px;text-decoration:none}
.vActs button:active,.vActs a:active{background:#2a2925}
.vActs .del{color:#E5533D}
.vActs .pri{color:#F2B705}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:none;border-radius:10px;padding:10px 12px}
.opt svg{width:26px;height:26px;flex:none;color:var(--mute)}
.opt b{display:block;font-size:14px;font-weight:600}
.opt small{display:block;font-size:12px;color:var(--mute);line-height:1.35;margin-top:2px}
.opt.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.opt.on svg{color:var(--gold)}
/* escolher capa */
#capaUI{position:fixed;inset:0;z-index:40;background:#0d0d0c;color:#F3EFE3;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#capaUI.on{display:flex}
.cHead{height:48px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 6px}
.cHead .x{width:40px;height:40px;border:0;background:none;color:#F3EFE3;display:grid;place-items:center}
.cHead span{flex:1;font-size:15px;font-weight:600}
.cOk{border:0;border-radius:6px;background:#F2B705;color:#1A1400;font-weight:700;font-size:14px;padding:8px 14px}
.cStage{flex:1 1 0;min-height:0;position:relative;overflow:hidden}
.cStage video,.cStage img{position:absolute;left:8px;top:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;display:block}
.cStage .tag{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:4px 10px;border-radius:12px;font-size:12px;font-variant-numeric:tabular-nums}
.cCtl{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;padding:4px 10px;max-width:640px;width:100%;margin:0 auto}
.cCtl button{width:44px;height:40px;border:0;border-radius:8px;background:#2a2925;color:#F3EFE3;display:grid;place-items:center;font-size:12px}
.cCtl input{width:100%;accent-color:#F2B705;height:32px}
.cHint{flex:none;text-align:center;font-size:12px;color:#9C9686;padding:2px 12px 6px}
.cSug{flex:none;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 10px 8px;max-width:640px;width:100%;margin:0 auto}
.cSug::-webkit-scrollbar{display:none}
.cSug button{flex:none;width:76px;aspect-ratio:16/10;border-radius:6px;border:2px solid transparent;background:#2a2925 center/cover no-repeat;padding:0}
.cSug button.on{border-color:#F2B705}
.cFoot{flex:none;display:flex;gap:8px;justify-content:center;padding:4px 10px 12px;flex-wrap:wrap}
.cFoot button{border:1.5px solid #3a3933;background:none;color:#cfcac0;border-radius:6px;padding:8px 12px;font-size:13px;display:flex;align-items:center;gap:6px}
.cFoot svg{width:16px;height:16px}
.vNav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;border:0;border-radius:8px;background:rgba(0,0,0,.35);color:#F3EFE3;display:grid;place-items:center}
.vNav.l{left:4px}.vNav.r{right:4px}
.vNav:disabled{display:none}

/* diálogos */
#dlg{position:fixed;inset:0;z-index:50;background:var(--shade);display:none;place-items:center;padding:20px}
#dlg.on{display:grid}
.box{background:var(--panel);border-radius:12px;padding:18px;width:min(92vw,380px)}
.box h2{font-size:17px;font-weight:600;margin-bottom:6px}
.box p{font-size:13px;color:var(--mute);line-height:1.45}
.box .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.box .chips button{border:1.5px solid var(--line);background:none;border-radius:20px;padding:8px 13px;font-size:13px;display:flex;align-items:center;gap:6px}
.box .chips button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.box .chips button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.box .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.box .acts button{border:0;border-radius:6px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--panel2)}
.box .acts .pri{background:var(--gold);color:var(--gold-ink)}
.box .acts .danger{background:var(--danger);color:#fff}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1}
body.sel #toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.list,.bar,.filters{padding-left:16px;padding-right:16px}}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a href="./" id="backLink" aria-label="Voltar para a Central"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Central</a>
  <h1>Biblioteca</h1>
  <span class="sp"></span>
  <button class="addBtn" id="addBtn"></button>
</header>
<nav class="filters" id="filters" aria-label="De onde veio"></nav>
<nav class="pastas" id="pastas" aria-label="Pastas"></nav>
<div class="bar">
  <label class="search"><span id="icSearch"></span><input id="q" type="search" placeholder="Buscar" aria-label="Buscar pelo nome ou pela fala" autocomplete="off"></label>
  <button class="ib" id="typeBtn" aria-label="Mostrar: tudo"></button>
  <button class="ib" id="sortBtn" aria-label="Ordem: mais novos primeiro"></button>
  <button class="ib" id="selBtn" aria-label="Selecionar vários"></button>
</div>
<main class="list" id="list"></main>
<div class="selBar" id="selBar">
  <button id="sX" class="x" aria-label="Sair da seleção"></button>
  <span id="selN">0</span>
  <button id="sEdit"></button>
  <button id="sPasta"></button>
  <button id="sDown"></button>
  <button id="sDel" class="del"></button>
</div>

<div id="view" role="dialog" aria-label="Gravação">
  <div class="vHead"><button id="vX" aria-label="Fechar"></button><input id="vName" aria-label="Nome da gravação" maxlength="120"></div>
  <div class="vStage" id="vStage"></div>
  <p class="vInfo" id="vInfo"></p>
  <div class="vActs" id="vActs"></div>
</div>

<div id="capaUI" role="dialog" aria-label="Escolher capa">
  <div class="cHead"><button class="x" id="cX" aria-label="Cancelar"></button><span>Escolher capa</span><button class="cOk" id="cOk">Usar esta</button></div>
  <div class="cStage" id="cStage"></div>
  <div class="cCtl" id="cCtl"><button id="cPrev" aria-label="Voltar um quadro"></button><input type="range" id="cRange" min="0" max="1" step="0.01" value="0" aria-label="Momento do vídeo"><button id="cNext" aria-label="Avançar um quadro"></button></div>
  <p class="cHint" id="cHint">Arraste até a parte que você quer como capa</p>
  <div class="cSug" id="cSug"></div>
  <div class="cFoot"><button id="cGal"></button><button id="cAuto"></button></div>
</div>
<input type="file" id="fCapa" accept="image/*" hidden>
<div id="dlg"><div class="box" id="dlgBox"></div></div>
<input type="file" id="fIn" accept="video/*,audio/*,image/*" multiple hidden>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ===== Biblioteca da Tamaki Central =====
   Guarda gravações no próprio aparelho (IndexedDB "tamaki-biblioteca").
   Todas as abas no mesmo site (tamakishions2-tech.github.io) enxergam a mesma biblioteca. */
const TamakiBib={
  abrir(){return new Promise((ok,no)=>{const r=indexedDB.open('tamaki-biblioteca',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('itens'))db.createObjectStore('itens',{keyPath:'id'});};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});},
  async salvar(blob,o={}){
    if(!window.indexedDB||!blob||!blob.size)throw new Error('vazio');
    const mime=(blob.type||'').split(';')[0],tipo=mime.startsWith('audio/')?'audio':mime.startsWith('image/')?'imagem':'video';
    const it={id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),origem:o.origem||'outro',tipo,nome:o.nome||'Gravação',texto:o.texto||'',mime,tamanho:blob.size,criado:Date.now(),blob};
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    const db=await this.abrir();

/* procura um Editor aberto em outra aba da Central */
function acharEditor(){
  return new Promise(ok=>{
    let bc;try{bc=new BroadcastChannel('tamaki-editor');}catch(_){return ok(null);}
    const t=setTimeout(()=>{bc.close();ok(null);},800);
    bc.onmessage=e=>{const d=e.data||{};if(d.tipo==='pong'&&d.de===LIB_ID){clearTimeout(t);bc.close();ok(d);}};
    bc.postMessage({tipo:'ping',de:LIB_ID});
  });
}
function enviarEditor(ed,ids,modo){
  return new Promise(ok=>{
    const bc=new BroadcastChannel('tamaki-editor');
    const t=setTimeout(()=>{bc.close();ok(null);},45000);
    bc.onmessage=e=>{const d=e.data||{};if(d.tipo==='ok'&&d.para===LIB_ID){clearTimeout(t);bc.close();ok(d.n);}};
    bc.postMessage({tipo:'add',para:ed.id,de:LIB_ID,ids,modo});
  });
}
async function mandarEditor(its){
  its=its.filter(it=>it.tipo==='video'||it.tipo==='audio'||it.tipo==='imagem');
  if(!its.length)return;
  const modo=await escolherModo(its);if(!modo)return;
  const ids=its.map(it=>it.id),url=`editor.html?bib=${ids.join(',')}&modo=${modo}`;
  toast('Procurando o Editor…');
  const ed=await acharEditor();
  if(ed&&ed.exportando)return toast('O Editor está exportando agora. Espere terminar e mande de novo.');
  if(ed){
    toast('Mandando para o Editor…');
    const n=await enviarEditor(ed,ids,modo);
    if(n>0){toast(n===1?'Pronto! Está no Editor. Abra a aba Editor.':`Pronto! ${n} itens no Editor. Abra a aba Editor.`);if(V.selMode)setSelMode(false);}

    return;
  }
  $('#dlgBox').innerHTML=`<h2>O Editor não está aberto</h2><p>Abra a aba Editor na Central e mande de novo: assim o item entra no projeto que você já está editando.</p><p style="margin-top:8px">Ou abra o Editor aqui mesmo, num projeto novo.</p><div class="acts"><button data-r="0">Cancelar</button><button class="pri" data-r="1">Abrir o Editor aqui</button></div>`;

const C={it:null,v:null,url:null,pend:null,seeking:false,sugTok:0};
async function salvarCapa(it,thumb,extra){
  Object.assign(it,{thumb,capaManual:true,tv:TV},extra||{});delete it.thumbErr;

function atualizarCard(it){const card=document.querySelector(`.card[data-id="${it.id}"]`);if(card){const tmp=document.createElement('div');tmp.innerHTML=cardH(it);card.replaceWith(tmp.firstElementChild);}}
function abrirCapa(it){
  if(it.tipo==='audio'){
    $('#dlgBox').innerHTML=`<h2>Capa do áudio</h2><p>Escolha uma imagem do tablet para aparecer no lugar da onda.</p><div class="acts">${it.capaManual?'<button data-r="auto">Voltar à onda</button>':''}<button data-r="0">Cancelar</button><button class="pri" data-r="gal">Escolher imagem</button></div>`;

    $('#dlgBox').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{$('#dlg').classList.remove('on');const r=b.dataset.r;if(r==='gal'){C.it=it;$('#fCapa').click();}else if(r==='auto')capaAutomatica(it);});
    return;
  }
  C.it=it;if(C.url)URL.revokeObjectURL(C.url);C.url=URL.createObjectURL(it.blob);
  $('#cStage').innerHTML=`<video id="cVid" muted playsinline preload="auto" src="${C.url}"></video><span class="tag" id="cTag">00:00</span>`;
  const v=C.v=$('#cVid');
  $('#cRange').max=Math.max(.1,it.dur||1);$('#cRange').value=Math.min(it.capaT||0,it.dur||0);
  v.addEventListener('loadedmetadata',async()=>{
    const d=isFinite(v.duration)&&v.duration>0?v.duration:it.dur||1;$('#cRange').max=d;
    irPara(+$('#cRange').value||0);sugestoes(it,d);
  },{once:true});
  v.addEventListener('seeked',()=>{C.seeking=false;if(C.pend!==null){const t=C.pend;C.pend=null;irPara(t);}});
  $('#capaUI').classList.add('on');

function irPara(t){
  const v=C.v;if(!v)return;const max=+$('#cRange').max;t=Math.max(0,Math.min(max,t));
  $('#cRange').value=t;$('#cTag').textContent=fmtPreciso(t);
  if(C.seeking){C.pend=t;return;}
  C.seeking=true;v.currentTime=t;
  document.querySelectorAll('#cSug button').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.t-t)<.05));
}
const fmtPreciso=t=>{const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+s.toFixed(1).padStart(4,'0').replace('.',',');};
async function sugestoes(it,d){
  const tok=++C.sugTok,box=$('#cSug');box.innerHTML='';
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=C.url;
  try{await waitEv(v,'loadedmetadata',6000);}catch(_){return;}
  const n=d>4?8:5;
  for(let i=0;i<n;i++){
    if(tok!==C.sugTok||!$('#capaUI').classList.contains('on'))break;
    const t=d*(i+.5)/n;await seekTo(v,t);if(v.readyState<2)continue;
    const b=document.createElement('button');b.dataset.t=t;b.style.backgroundImage=`url('${snapFit(v,v.videoWidth,v.videoHeight,160)}')`;b.setAttribute('aria-label','Usar o momento '+fmtDur(t||1));
    b.onclick=()=>irPara(t);box.appendChild(b);
  }
  v.removeAttribute('src');v.load();
}
function fecharCapa(){

  $('#dlgBox').innerHTML=`<h2>Roteiros desta pasta</h2><p>Escolha as notas da aba Escrita que fazem parte deste vídeo.</p><div class="lst">${notas.map(n=>`<label><input type="checkbox" value="${esc(n.id)}" ${(p.rot||[]).includes(n.id)?'checked':''}>${esc(n.titulo)}<small>${esc(n.pasta)}</small></label>`).join('')}</div><div class="acts"><button data-r="0">Cancelar</button><button class="pri" data-r="1">Salvar</button></div>`;
  $('#dlg').classList.add('on');
  $('#dlgBox').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(b.dataset.r==='1'){p.rot=[...$('#dlgBox').querySelectorAll('input:checked')].map(i=>i.value);salvaPastas();render();}$('#dlg').classList.remove('on');});
}
/* .zip sem compressão (vídeo e áudio já vêm comprimidos), com nomes em UTF-8 */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
async function crc32(blob,prog){let c=~0;const P=8<<20;for(let o=0;o<blob.size;o+=P){const u=new Uint8Array(await blob.slice(o,o+P).arrayBuffer());for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);prog&&prog(Math.min(blob.size,o+P));}return (~c)>>>0;}
async function montarZip(arqs,prog){
  const enc=new TextEncoder(),partes=[],cent=[],d0=new Date(),hora=d0.getHours()<<11|d0.getMinutes()<<5|d0.getSeconds()>>1,dia=(d0.getFullYear()-1980)<<9|(d0.getMonth()+1)<<5|d0.getDate();
  const total=arqs.reduce((s,a)=>s+a.blob.size,0);let off=0,feito=0;
  for(const a of arqs){const nb=enc.encode(a.nome),tam=a.blob.size,c=await crc32(a.blob,x=>prog&&prog((feito+x)/total)),h=new DataView(new ArrayBuffer(30)),ce=new DataView(new ArrayBuffer(46));feito+=tam;
    if(off+tam>4294967295)throw new Error('a pasta passou de 4 GB');
    [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[10,hora,2],[12,dia,2],[14,c,4],[18,tam,4],[22,tam,4],[26,nb.length,2]].forEach(([o,v,t])=>t===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[12,hora,2],[14,dia,2],[16,c,4],[20,tam,4],[24,tam,4],[28,nb.length,2],[42,off,4]].forEach(([o,v,t])=>t===4?ce.setUint32(o,v,true):ce.setUint16(o,v,true));
    partes.push(h,nb,a.blob);cent.push(ce,nb);off+=30+nb.length+tam;}
  const tc=cent.reduce((s,x)=>s+x.byteLength,0),fim=new DataView(new ArrayBuffer(22));fim.setUint32(0,0x06054b50,true);fim.setUint16(8,arqs.length,true);fim.setUint16(10,arqs.length,true);fim.setUint32(12,tc,true);fim.setUint32(16,off,true);
  return new Blob([...partes,...cent,fim],{type:'application/zip'});
}
const limpaNome=n=>(n||'').replace(/[\\/:*?"<>|]+/g,'-').trim()||'sem-nome';
async function baixarPasta(p){
  const its=V.items.filter(it=>it.pasta===p.id),notas=notasEscrita(),rots=(p.rot||[]).map(id=>notas.find(n=>n.id===id)).filter(Boolean);
  if(!its.length&&!rots.length)return toast('A pasta está vazia');
  const nome=await pergunta('Baixar a pasta','Escolha o nome do arquivo .zip. Dentro dele vão as pastas Vídeos, Áudios, Imagens e Roteiros.',p.nome,'Baixar .zip');if(!nome)return;
  const usados=new Set(),unico=n=>{let x=n,k=2;while(usados.has(x.toLowerCase()))x=n.replace(/(\.[^.]+)?$/,` (${k++})$1`);usados.add(x.toLowerCase());return x;};
  const sub={video:'Vídeos',audio:'Áudios',imagem:'Imagens'},arqs=[];
  for(const it of its)arqs.push({nome:unico(`${sub[it.tipo]||'Outros'}/${limpaNome(it.nome)}.${((it.mime||'').split('/')[1]||'bin').replace('mpeg','mp3').replace('x-matroska','mkv')}`),blob:it.blob});
  for(const r of rots)arqs.push({nome:unico(`Roteiros/${limpaNome(r.titulo)}.txt`),blob:new Blob([r.titulo+'\r\n\r\n'+htmlTexto(r.html).replace(/\n/g,'\r\n')],{type:'text/plain;charset=utf-8'})});
  // onde salvar: o navegador deixa escolher a pasta quando consegue; no tablet, vai para Downloads
  let alvo=null;if(window.showSaveFilePicker){try{alvo=await showSaveFilePicker({suggestedName:limpaNome(nome)+'.zip',types:[{description:'Arquivo .zip',accept:{'application/zip':['.zip']}}]});}catch(e){if(e.name==='AbortError')return;}}
  toast('Montando o .zip…');
  try{const z=await montarZip(arqs,f=>{$('#toast').textContent=`Montando o .zip… ${Math.round(f*100)}%`;});
    if(alvo){const w=await alvo.createWritable();await w.write(z);await w.close();toast('Salvo: '+alvo.name);}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(z);a.download=limpaNome(nome)+'.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast(`Baixando “${limpaNome(nome)}.zip” (${fmtSize(z.size)})`);}
  }catch(e){toast('Não consegui montar o .zip: '+e.message);}
}
$('#pastas').addEventListener('click',async e=>{const b=e.target.closest('[data-p]');if(!b)return;
  if(b.dataset.p==='+'){const p=await novaPasta();if(p){V.pasta=p.id;render();}return;}
  V.pasta=V.pasta===b.dataset.p?null:b.dataset.p;render();$('#list').scrollTop=0;});
$('#list').addEventListener('click',async e=>{const p=pastaAtual();if(!p)return;
  const t=e.target.closest('[data-tira]');if(t){p.rot=(p.rot||[]).filter(x=>x!==t.dataset.tira);salvaPastas();return render();}
  const b=e.target.closest('[data-pa]');if(!b)return;const a=b.dataset.pa;
  if(a==='zip')baixarPasta(p);else if(a==='add')$('#fIn').click();else if(a==='rot')escolherRoteiros(p);
  else if(a==='nome'){const n=await pergunta('Renomear pasta','',p.nome,'Salvar');if(n){p.nome=n;salvaPastas();render();}}
  else if(a==='del'){if(!await confirmar('Apagar a pasta?','Os vídeos e áudios continuam na Biblioteca; só a pasta some.','Apagar pasta'))return;
    for(const it of V.items.filter(x=>x.pasta===p.id)){it.pasta=null;await dbPut(it);}PASTAS=PASTAS.filter(x=>x!==p);salvaPastas();V.pasta=null;render();}
});

/* ================= eventos ================= */
$('#addBtn').innerHTML=svg('plus')+'Adicionar';$('#addBtn').onclick=()=>$('#fIn').click();
$('#icSearch').innerHTML=svg('search');
$('#selBtn').innerHTML=svg('select');
$('#sEdit').innerHTML=svg('scissors')+'Editor';$('#sPasta').innerHTML=svg('folder')+'Pasta';$('#sPasta').onclick=()=>moverParaPasta(selItems());$('#sDown').innerHTML=svg('down')+'Baixar';$('#sDel').innerHTML=svg('trash')+'Apagar';$('#sX').innerHTML=svg('x');
$('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-o]');if(!b)return;V.org=b.dataset.o;saveVista();render();$('#list').scrollTop=0;});
$('#typeBtn').onclick=()=>{const i=TIPOS.findIndex(x=>x[0]===V.tipo);V.tipo=TIPOS[(i+1)%TIPOS.length][0];saveVista();render();toast('Mostrando '+TIPOS.find(x=>x[0]===V.tipo)[2]);};
$('#sortBtn').onclick=()=>{const i=SORTS.findIndex(x=>x[0]===V.sort);V.sort=SORTS[(i+1)%SORTS.length][0];saveVista();render();toast('Ordem: '+SORTS.find(x=>x[0]===V.sort)[2]);};
$('#selBtn').onclick=()=>setSelMode(!V.selMode);
$('#sX').onclick=()=>setSelMode(false);
$('#sEdit').onclick=()=>mandarEditor(selItems());
$('#sDown').onclick=()=>{const its=selItems();its.forEach((it,k)=>setTimeout(()=>baixar(it),k*400));if(its.length>1)toast('Baixando '+its.length+' arquivos');};
$('#sDel').onclick=async()=>{if(await apagar(selItems())&&!V.items.length)setSelMode(false);};
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{V.q=e.target.value;render();},150);});

/* toque abre; toque longo (ou modo seleção) marca */
let press=null;
$('#list').addEventListener('pointerdown',e=>{
  const c=e.target.closest('.card');if(!c)return;
  press={id:c.dataset.id,x:e.clientX,y:e.clientY,long:false,t:setTimeout(()=>{press.long=true;if(!V.selMode)setSelMode(true);toggleSel(c.dataset.id);if(navigator.vibrate)navigator.vibrate(15);},480)};
});
const cancelPress=()=>{if(press){clearTimeout(press.t);}};
$('#list').addEventListener('pointermove',e=>{if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>10){cancelPress();press=null;}});
$('#list').addEventListener('pointercancel',()=>{cancelPress();press=null;});
$('#list').addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault();});
$('#list').addEventListener('click',e=>{
  const a=e.target.closest('[data-act=add]');if(a){$('#fIn').click();return;}
  const c=e.target.closest('.card');if(!c)return;
  const wasLong=press&&press.long;cancelPress();press=null;if(wasLong)return;
  const snd=e.target.closest('[data-send]');
  if(snd&&!V.selMode){const it=V.items.find(x=>x.id===snd.dataset.send);if(it)mandarEditor([it]);return;}
  if(V.selMode)toggleSel(c.dataset.id);else abrirView(c.dataset.id);
});
document.addEventListener('keydown',e=>{
  if($('#dlg').classList.contains('on')){if(e.key==='Escape')$('#dlg').querySelector('[data-r="0"]')?.click();return;}
  if($('#capaUI').classList.contains('on')){if(e.key==='Escape')fecharCapa();else if(e.key==='ArrowLeft')$('#cPrev').click();else if(e.key==='ArrowRight')$('#cNext').click();return;}
  if(V.view){
    if(e.target.tagName==='INPUT')return;
    if(e.key==='Escape')fecharView();
    else if(e.key==='ArrowLeft')$('#vPrev')?.click();
    else if(e.key==='ArrowRight')$('#vNext')?.click();
  }else if(e.key==='Escape'&&V.selMode)setSelMode(false);
});
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')$('#dlg').querySelector('[data-r="0"]')?.click();});

/* quando outra aba grava algo, a lista atualiza sozinha */
try{new BroadcastChannel('tamaki-biblioteca').onmessage=()=>{if(!V.view&&!C.it)load();};}catch(_){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!V.view&&!$('#capaUI').classList.contains('on'))load();});
if(window.self!==window.top)$('#backLink').style.display='none';
if(navigator.storage&&navigator.storage.persist)navigator.storage.persisted().then(p=>{if(!p)navigator.storage.persist().catch(()=>{});}).catch(()=>{});
load();
