<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f24">
<meta name="color-scheme" content="dark">
<title>Palco · Estúdio da Tamaki</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f24;--pn:#1b1736;--pn2:#231e45;--ln:#2e2a55;--tx:#efe9f7;--mu:#a49cc9;--or:#ff9f45;--gold:#f2b632;--te:#5fd9cf;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset:disabled{opacity:.45}
#app{height:100dvh;display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"cam palco" "cam doca"}
/* camadas */
#cam{grid-area:cam;display:flex;flex-direction:column;background:var(--pn);border-right:1px solid var(--ln);min-height:0}
.tit{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:700;border-bottom:1px solid var(--ln)}
.lista{flex:1;min-height:0;overflow:auto;padding:6px}
.ly{display:flex;align-items:center;gap:6px;padding:5px;border:1px solid transparent;border-radius:10px;margin-bottom:4px;background:var(--pn2);cursor:pointer}
.ly.on{border-color:var(--or);background:#2f2552}
.ly.filho{margin-left:18px}
.pc{display:grid;grid-template-columns:minmax(0,2fr) 1fr 1fr;gap:6px;align-items:end;margin-bottom:6px}
.pc .ly{margin:0}
@media (max-width:760px){.pc{grid-template-columns:1fr 1fr}.pc .ly{grid-column:1/-1}}
.ly.pasta{background:#2a2350}
.th{width:46px;height:46px;flex:none;object-fit:contain;border-radius:6px;background:conic-gradient(#3a3560 25%,#2a2650 0 50%,#3a3560 0 75%,#2a2650 0) 0 0/12px 12px}
.fi{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:1.6rem;border-radius:8px;background:#3a3166;object-fit:cover}
.ly .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.ly small{display:block;color:var(--mu);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.ic{flex:none;background:none;border:0;width:34px;height:40px;font-size:1.05rem;color:var(--mu);border-radius:8px}
.ic.off{opacity:.3}
.ic.lk{opacity:1}
.barra{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-top:1px solid var(--ln)}
.barra button,.barra label{display:grid;place-items:center;background:var(--pn2);border:1px solid var(--ln);border-radius:8px;min-height:40px;font-size:.76rem;text-align:center;cursor:pointer;padding:0 2px}
.barra .add{background:var(--or);color:#24130a;font-weight:700;border-color:var(--or)}
.vazio{color:var(--mu);padding:12px;text-align:center;margin:0}
/* palco */
#palco{grid-area:palco;display:flex;flex-direction:column;min-height:0;min-width:0}
#topo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--ln);background:var(--pn)}
.bt{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:0 12px;min-height:40px}
.bt.pri{background:var(--or);border-color:var(--or);color:#24130a;font-weight:700}
.bt.rec{color:#ff6b6b}
.bt.rec.on{background:#c62828;border-color:#c62828;color:#fff}
.bt.mini{padding:0 10px;font-size:1.1rem}
#st{margin-left:auto;color:var(--mu);font-size:.78rem}
#tela{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
#cv{flex:none;border-radius:8px;border:1px solid var(--ln);touch-action:none;background:conic-gradient(#3a3560 25%,#2a2650 0 50%,#3a3560 0 75%,#2a2650 0) 0 0/24px 24px}
/* doca */
#doca{grid-area:doca;background:var(--pn);border-top:1px solid var(--ln);min-width:0}
#painel{height:214px;overflow:auto;padding:8px 12px}
#ferr{display:flex;border-top:1px solid var(--ln)}
#ferr button{flex:1;background:none;border:0;border-top:3px solid transparent;min-height:48px;color:var(--mu);font-size:.84rem;padding:0 2px}
#ferr button.on{color:var(--or);border-top-color:var(--gold);font-weight:700}
#ferr .so-retrato{display:none}
.sub{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.f .sub{margin:0}
.sub button{background:var(--pn2);border:1px solid var(--ln);border-radius:999px;padding:4px 12px;color:var(--mu);font-size:.8rem}
.sub button.on{border-color:var(--or);color:var(--or);font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 14px;align-items:end}
.f{display:grid;gap:3px;font-size:.78rem;color:var(--mu)}
.f b{display:flex;justify-content:space-between;font-weight:600}
.f b i{font-style:normal;color:var(--tx)}
.f input[type=range]{width:100%;accent-color:var(--or)}
.f select,.f input[type=text],textarea{background:#0b0918;border:1px solid var(--ln);border-radius:8px;padding:7px;width:100%}
.f input[type=color]{width:100%;height:36px;border:1px solid var(--ln);border-radius:8px;background:#0b0918;padding:2px}
.chk{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:.84rem;min-height:38px}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btns .bt{min-height:38px}
.fala{display:grid;grid-template-columns:1fr auto;gap:10px;height:100%}
.fala textarea{height:100%;min-height:0;resize:none}
.fala .lado{display:flex;flex-direction:column;gap:6px;min-width:150px}
.dica{color:var(--mu);font-size:.78rem;margin:4px 0 0}
.icones{display:flex;flex-wrap:wrap;gap:4px}
.icones button,.icones label{width:38px;height:38px;display:grid;place-items:center;background:var(--pn2);border:1px solid var(--ln);border-radius:8px;font-size:1.15rem;cursor:pointer}
.icones .on{border-color:var(--or)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{background:var(--pn2);border:1px solid var(--ln);border-radius:999px;padding:5px 10px;font-size:.8rem;color:var(--mu)}
.chips button.on{border-color:var(--or);color:var(--tx)}
.esc{display:none}
#toast{position:fixed;left:50%;bottom:290px;transform:translateX(-50%);background:var(--or);color:#24130a;font-weight:700;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"palco" "doca"}
  #cam{display:none}
  #ferr .so-retrato{display:block}
  #ferr button{font-size:.72rem}
  #painel{height:236px}
  #painel .lista{padding:0;overflow:visible}
  #painel .barra{padding:6px 0 0}
  #st{display:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="cam">
    <div class="tit">Camadas <small class="dica">a de cima fica na frente</small></div>
    <div class="lista" id="lista"></div>
    <div class="barra" id="barra"></div>
  </aside>
  <section id="palco">
    <div id="topo">
      <button class="bt pri" data-a="falar">▶ Falar</button>
      <button class="bt" data-a="parar">■ Parar</button>
      <button class="bt rec" data-a="gravar" id="bRec">● Gravar</button>
      <button class="bt mini" data-a="desfazer" aria-label="Desfazer" title="Desfazer">↶</button>
      <button class="bt mini" data-a="refazer" aria-label="Refazer" title="Refazer">↷</button>
      <button class="bt" data-a="formato" id="bFmt">16:9</button>
      <button class="bt" data-a="fundo" id="bFundo">Fundo</button>
      <label class="chk"><input type="checkbox" id="guias"> Guias</label>
      <span id="st">Termux: desconectado</span>
    </div>
    <div id="tela"><canvas id="cv"></canvas></div>
  </section>
  <section id="doca">
    <div id="painel"></div>
    <nav id="ferr">
      <button class="so-retrato" data-t="camadas">Camadas</button>
      <button data-t="camada">Camada</button>
      <button data-t="anim">Animação</button>
      <button data-t="rosto">Rosto</button>
      <button data-t="balao">Balão</button>
      <button data-t="fala">Fala</button>
      <button data-t="efeitos">Efeitos</button>
      <button data-t="voz">Voz</button>
    </nav>
  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fPng" accept="image/*" multiple class="esc">
<input type="file" id="fAud" accept="audio/*" class="esc">
<input type="file" id="fImp" accept=".json,application/json" class="esc">
<input type="file" id="fIco" accept="image/*" class="esc">
<input type="file" id="fPose" accept="image/*" class="esc">
<input type="file" id="fSpr" accept="image/*" multiple class="esc">
<input type="file" id="fFace" accept="image/*" multiple class="esc">
<input type="file" id="fFaceSpr" accept="image/*" multiple class="esc">

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "palco-cfg"; // mesmos dados do Palco da Ficha da Tamaki
const DEF = {expr: 0, exprVolta: 0, url:"http://127.0.0.1:8765", motor:"termux", voice:"pf_dora", speed:1.05, pause:0.4, bg:"check", gain:4, thr:0.15, guides:1, text:"", layers:[], folders:[], sel:null, fmt:"16:9",
  bal:{on:1, lock:0, estilo:"rpg", fundo:"#06050f", opF:1, borda:"#ffffff", texto:"#ffffff", fonte:"pixel", tam:3.2, alinh:"left", digitar:1, nome:"", nomeCor:"#ff9f45", rabo:"baixo", raboX:.25, seguir:"", cam:0,
    pos:{"16:9":{x:50, y:82, w:94, h:28}, "9:16":{x:50, y:84, w:94, h:24}}},
  fx:{zoom:1, px:0, py:0, rot:0, reage:0, dur:1, intro:"titulo", titulo:"TAMAKI SHION", sub:"", cor:"#ff9f45", gIntro:0, gEntrada:1, gSaida:1}};
const PRESETS = [["natural", "Natural"], ["doce", "Mais doce"], ["call", "Call (microfone)"], ["radio", "Rádio"], ["original", "Sem efeito"]];
const PRESET = {natural: {tom: 0, vel: 1, variar: .4, pausa: 1, calor: 2, clareza: 2, brilho: 1, sala: .05, vol: 1, comp: 1},
  doce: {tom: 1.5, vel: 1.02, variar: .5, pausa: 1, calor: 1, clareza: 3, brilho: 3, sala: .06, vol: 1, comp: 1},
  call: {tom: 0, vel: 1, variar: .3, pausa: 1, calor: 3, clareza: 4, brilho: -2, sala: 0, vol: 1.1, comp: 1},
  radio: {tom: 0, vel: 1, variar: .2, pausa: 1, calor: -5, clareza: 6, brilho: -6, sala: 0, vol: 1.1, comp: 1},
  original: {tom: 0, vel: 1, variar: 0, pausa: 1, calor: 0, clareza: 0, brilho: 0, sala: 0, vol: 1, comp: 0}};
const VOZDEF = {azVoz: "pt-BR-FranciscaNeural", azEstilo: "", elVoz: "", elModelo: "eleven_multilingual_v2", elEst: .45, elSim: .8, elStyle: .15, navVoz: ""};
const PAPEIS = [["always","Sempre visível"],["open","Boca aberta (falando)"],["closed","Boca fechada (parada)"],["eyeopen","Olho aberto"],["eyeclosed","Olho fechado (piscar)"]];
const PARADA = [["none","Nenhuma"],["bob","Flutuar"],["sway","Balançar"],["breathe","Respirar"],["squash","Respirar (amassa e estica)"],["flicker","Cintilar"]];
const FALANDO = [["none","Nenhuma"],["hop","Pular"],["shake","Tremer"],["grow","Esticar"],["squash","Amassar e esticar"],["tilt","Inclinar"]];
// Folha de sprites: a imagem é uma grade de quadros que o palco vai trocando.
const SPRDEF = {on: 0, cols: 4, rows: 1, n: 4, fps: 8, modo: "loop", cada: 4};
const MODOS = [["loop","Repetir sempre"],["vaievem","Vai e volta"],["fala","Só enquanto fala"],["pisca","Uma vez a cada piscada"],["vez","Uma vez de tempos em tempos"]];
const EXPRS = [["0","Sempre (todas as expressões)"],["-1","Só sem expressão (some nas expressões)"],...[1,2,3,4,5,6,7,8,9].map(n => [String(n), "Só na expressão " + n])];
const TIPOS = [["personagem","Personagem"],["decoracao","Decoração"],["cenario","Cenário"]];
const NOMEPOSE = {parada: "Parada", falando: "Falando", falando2: "Falando 2"};
const ICONES = ["📁","⭐","🎀","👀","👄","💇","👕","🖐","🌙","🔥","🐔","🐱","🎮","📚","💬","✨"];
const FUNDOS = {check: "Fundo: xadrez", chroma: "Fundo: verde", app: "Fundo: roxo"};
const copia = o => JSON.parse(JSON.stringify(o));
const PDEF = {trans: "pulo", dur: 180, segurar: 250, troca: "tempo", vel: 150, amp: 3, juntas: 1};
function normalizar(c){
  c.folders = c.folders || []; c.layers = c.layers || []; const novas = [];
  c.layers.forEach(L => { if (!L.tipo) L.tipo = "decoracao"; if (L.tipo == "personagem") { if (!L.pose) L.pose = "parada"; if (!L.pers) L.pers = "Tamaki"; if (L.poses) { for (const k of ["falando", "falando2"]) { const P = L.poses[k]; if (P && P.img) novas.push([L, Object.assign(copia(L), {id: Math.random().toString(36).slice(2, 9), img: P.img, name: L.name + (k == "falando" ? " · Falando" : " · Falando 2"), pose: k, x: L.x + (+P.dx || 0), y: L.y + (+P.dy || 0), w: L.w * (+P.k || 1), poses: undefined})]); } delete L.poses; } } if (L.op == null) L.op = 1; L.lock = L.lock ? 1 : 0; if (L.parent && !c.folders.some(f => f.id == L.parent)) L.parent = null; });
  novas.forEach(([L, n]) => c.layers.splice(c.layers.indexOf(L) + 1, 0, n));
  c.pers = c.pers || {}; c.layers.filter(L => L.tipo == "personagem").forEach(L => { c.pers[L.pers] = Object.assign(copia(PDEF), c.pers[L.pers] || {}); });
  const ob = c.bal ? copia(c.bal) : {}; if (!c.bal) { if (c.cap != null) ob.on = c.cap; if (c.capsz) ob.tam = c.capsz; }
  c.bal = Object.assign(copia(DEF.bal), ob); c.bal.pos = Object.assign(copia(DEF.bal.pos), ob.pos || {});
  c.fx = Object.assign(copia(DEF.fx), c.fx || {});
  c.voz = Object.assign(copia(VOZDEF), c.voz || {}); c.ed = Object.assign(copia(PRESET.natural), c.ed || {});
  return c;
}
let subV = "motor", subP = "parada", subA = "mov", TR = {}, mov = {}, mola = {}, sprE = {}, piscaIni = 0, exprAte = 0, verPose = null, mostrada = {}, ultimoAlto = -1e9;
const estados = {};
let cfg = normalizar(copia(DEF)), imgs = {}, aba = "camada", subB = "pos", subE = "cam", tm, hist = [], fut = [];
const cv = $("#cv"), g = cv.getContext("2d");
const chavesImgs = () => [...cfg.layers.flatMap(L => [L.img, ...(L.poses ? Object.values(L.poses).filter(Boolean).map(p => p.img) : [])]), ...cfg.folders.map(f => f.iconImg).filter(Boolean)];
const persDe = L => cfg.pers[L.pers] || (cfg.pers[L.pers] = copia(PDEF));
const irmas = L => cfg.layers.filter(x => x != L && x.tipo == "personagem" && x.pers == L.pers);
const paradaDe = nome => cfg.layers.find(x => x.tipo == "personagem" && x.pers == nome && x.pose == "parada");
const GEO = ["x", "y", "w", "r", "px", "py", "flip", "parent", "idle", "ia", "is", "talk", "ta", "op", "gruda", "gx", "gy", "gw"];
function copiarParada(o){ const p = paradaDe(o.pers); if (p && p != o) GEO.forEach(k => o[k] = p[k]); }
function proximaPose(nome, excl){ const tem = new Set(cfg.layers.filter(x => x != excl && x.tipo == "personagem" && x.pers == nome).map(x => x.pose)); return ["parada", "falando", "falando2"].find(p => !tem.has(p)) || "falando2"; }

/* ---------- guardar e desfazer ---------- */
const idb = () => new Promise((ok, no) => { const r = indexedDB.open("palco", 1); r.onupgradeneeded = () => r.result.createObjectStore("img"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const idbPut = async (k, v) => { const d = await idb(); return new Promise(ok => { const t = d.transaction("img", "readwrite"); t.objectStore("img").put(v, k); t.oncomplete = ok; }); };
const idbGet = async k => { const d = await idb(); return new Promise(ok => { const r = d.transaction("img").objectStore("img").get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }); };
const foto = () => JSON.stringify(Object.assign({}, cfg, {sel: null}));
function gravarLS(){ try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }
function salvar(){ clearTimeout(tm); tm = setTimeout(() => { gravarLS(); const s = foto(); if (hist[hist.length - 1] !== s) { hist.push(s); if (hist.length > 60) hist.shift(); fut = []; } }, 300); }
function restaurar(s){ const sel = cfg.sel; cfg = JSON.parse(s); cfg.sel = sel; gravarLS(); tamanho(); topo(); desenharLista(); painel(); }
function desfazer(){ if (hist.length < 2) return toast("Nada para desfazer"); fut.push(hist.pop()); restaurar(hist[hist.length - 1]); toast("Desfeito"); }
function refazer(){ if (!fut.length) return toast("Nada para refazer"); const s = fut.pop(); hist.push(s); restaurar(s); toast("Refeito"); }
const uid = () => Math.random().toString(36).slice(2, 9);
function carregarImg(k, blob){ const im = new Image(); im.src = URL.createObjectURL(blob); imgs[k] = im; return im; }
function toast(t){ const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 1600); }
function aviso(t){ const el = $("#msg"); if (el) el.textContent = t; else toast(t); }

/* ---------- camadas, pastas e seleção ---------- */
const pasta = id => cfg.folders.find(f => f.id == id);
const fDe = L => L.parent ? pasta(L.parent) : null;
const travada = L => !!(L.lock || (fDe(L) && fDe(L).lock));
const visivel = L => !!(L.vis && !(fDe(L) && !fDe(L).vis));
const tipoSel = () => cfg.sel == "balao" ? "bal" : String(cfg.sel || "").startsWith("f:") ? "pasta" : "camada";
const camada = () => tipoSel() == "camada" ? cfg.layers.find(l => l.id == cfg.sel) : null;
const pastaSel = () => tipoSel() == "pasta" ? pasta(cfg.sel.slice(2)) : null;
function geo(L){ const f = fDe(L), s = f ? +f.s || 1 : 1; return {X: 50 + (L.x - 50) * s + (f ? +f.dx || 0 : 0), Y: 50 + (L.y - 50) * s + (f ? +f.dy || 0 : 0), w: L.w * s, s}; }

/* ---------- áudio e voz ---------- */
let ac, an, buf, saida, cadV = null, cur = null, sp = false, fake = 0, lvl = 0, piscaAte = 0, proxPisca = 0, cap = "", capIni = 0, capDur = 1;
const FRASE = "Oi, gente! Aqui é a Tamaki. Vocês não vão acreditar no que aconteceu hoje...";
let chaves = {}; try { chaves = JSON.parse(localStorage.getItem("palco-chaves")) || {}; } catch (e) {}
const guardarChaves = () => { try { localStorage.setItem("palco-chaves", JSON.stringify(chaves)); } catch (e) {} };
const lerLS = (k, f) => { try { return JSON.parse(localStorage.getItem(k)) || f; } catch (e) { return f; } };
let vozesAz = lerLS("palco-vozes-az", [{id: "pt-BR-FranciscaNeural", n: "Francisca (feminina)", est: []}, {id: "pt-BR-ThalitaNeural", n: "Thalita (feminina)", est: []}, {id: "pt-BR-AntonioNeural", n: "Antonio (masculina)", est: []}]);
let vozesEl = lerLS("palco-vozes-el", []);
function impulso(ctx){ const n = Math.floor(ctx.sampleRate * 1.4), b = ctx.createBuffer(2, n, ctx.sampleRate); for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); } return b; }
function cadeia(ctx){ // editor de voz: graves, clareza, brilho, compressor, sala e volume
  const ent = ctx.createGain(), f1 = ctx.createBiquadFilter(), f2 = ctx.createBiquadFilter(), f3 = ctx.createBiquadFilter(), cp = ctx.createDynamicsCompressor(), seco = ctx.createGain(), mol = ctx.createGain(), rv = ctx.createConvolver(), out = ctx.createGain();
  f1.type = "lowshelf"; f1.frequency.value = 250; f2.type = "peaking"; f2.frequency.value = 3000; f2.Q.value = .9; f3.type = "highshelf"; f3.frequency.value = 7500; rv.buffer = impulso(ctx);
  ent.connect(f1); f1.connect(f2); f2.connect(f3); f3.connect(cp); cp.connect(seco); seco.connect(out); cp.connect(rv); rv.connect(mol); mol.connect(out);
  const ajustar = () => { const E = cfg.ed; f1.gain.value = +E.calor; f2.gain.value = +E.clareza; f3.gain.value = +E.brilho;
    cp.threshold.value = E.comp ? -24 : 0; cp.ratio.value = E.comp ? 3.5 : 1; cp.knee.value = 12; cp.attack.value = .005; cp.release.value = .2;
    seco.gain.value = 1 - E.sala * .5; mol.gain.value = +E.sala; out.gain.value = +E.vol; };
  ajustar(); return {ent, out, ajustar};

  };
  if (sempre[a]) return sempre[a]();

  im.onload = () => { desenharLista(); painel(); }; salvar(); toast(n + " quadros juntados numa folha");
};
const papelPeloNome = n => /boca.*(abert|fal)|mouth.*open|open.*mouth/i.test(n) ? "open" : /boca|mouth/i.test(n) ? "closed" : /olho.*fech|piscad|blink|eye.*clos|clos.*eye/i.test(n) ? "eyeclosed" : /olho|eye/i.test(n) ? "eyeopen" : "always";
async function pecaRosto(blob, nome, spr){ // nova peça grudada no meio da cabeça, logo acima dela
  const cab = cfg.layers.find(x => x.id == cfg.rosto); if (!cab) { toast("Escolha a cabeça primeiro"); return; }
  const id = uid(), img = uid(), P = TR[chaveTR(cab)]; await idbPut(img, blob); const im = carregarImg(img, blob);
  const L = {id, img, name: nome, x: 50, y: 50, w: 20, r: 0, px: .5, py: .5, vis: 1, flip: 0, op: 1, lock: 0, parent: cab.parent || null, tipo: "decoracao", role: papelPeloNome(nome), idle: "none", ia: 3, is: 1, talk: "none", ta: 5,
    gruda: cab.id, gx: +((.5 - cab.px)).toFixed(3), gy: P ? +((.5 - cab.py) * P.h / P.w).toFixed(3) : 0, gw: .3, expr: 0};
  if (spr) L.spr = spr;
  const fam = descendentes(cab); if (cab.tipo == "personagem") cfg.layers.forEach(x => { if (x.tipo == "personagem" && x.pers == cab.pers) descendentes(x).forEach(i => fam.add(i)); }); // acima de todas as poses
  const ult = Math.max(...cfg.layers.map((x, i) => fam.has(x.id) ? i : -1)); cfg.layers.splice(ult + 1, 0, L);
  cfg.sel = id; im.onload = () => { desenharLista(); painel(); }; salvar(); desenharLista(); painel();
}
$("#fFace").onchange = async e => { const fs = [...e.target.files]; e.target.value = ""; for (const f of fs) if (/^image\//.test(f.type)) await pecaRosto(f, f.name.replace(/\.[^.]+$/, "")); };
$("#fFaceSpr").onchange = async e => { const F = await folha(e.target.files); e.target.value = ""; if (!F) return;
  await pecaRosto(F.blob, F.nome || "Peça animada", Object.assign(copia(SPRDEF), {on: 1, cols: F.cols, rows: F.rows, n: F.n})); toast(F.n + " quadros juntados numa peça animada"); };
$("#fIco").onchange = async e => { const fl = e.target.files[0], f = pastaSel(); e.target.value = ""; if (!fl || !f) return; const k = uid(); await idbPut(k, fl); const im = carregarImg(k, fl); f.iconImg = k; im.onload = () => { desenharLista(); painel(); }; salvar(); };

/* ---------- cópia de segurança (mesmo formato do Palco da ficha) ---------- */
const paraTexto = b => new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
async function exportar(){
  const im = {}, chaves = chavesImgs();
  for (const k of chaves) if (!im[k]) { const b = await idbGet(k); if (b) im[k] = await paraTexto(b); }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({palco: 1, cfg: Object.assign({}, cfg, {url: undefined, motor: undefined}), imgs: im})], {type: "application/json"}));
  a.download = "palco-tamaki.json"; a.click(); aviso("Palco exportado.");
}
async function importar(f){
  try { const o = JSON.parse(await f.text()); if (!o.palco || !Array.isArray(o.cfg.layers)) throw 0;
    for (const k in o.imgs) { const b = await (await fetch(o.imgs[k])).blob(); await idbPut(k, b); carregarImg(k, b); }
    cfg = normalizar(Object.assign({}, copia(DEF), o.cfg, {url: cfg.url, motor: cfg.motor})); salvar(); tamanho(); topo(); desenharLista(); painel(); aviso("Palco importado.");
  } catch (e) { aviso("Arquivo inválido."); }
}

/* ---------- início ---------- */
(async () => {
  try { const s = localStorage.getItem(KEY); if (s) cfg = normalizar(Object.assign(copia(DEF), JSON.parse(s))); } catch (e) {}
  const chaves = chavesImgs();
  for (const k of chaves) { try { const b = await idbGet(k); if (b && !imgs[k]) carregarImg(k, b); } catch (e) {} }
  const prontas = Object.values(imgs).map(im => new Promise(ok => { im.onload = im.onerror = ok; }));
  tamanho(); topo(); desenharLista(); painel(); selo(); hist = [foto()]; requestAnimationFrame(tick);
  await Promise.all(prontas); desenharLista();
  try { conectar(); } catch (e) {}
})();
})();
</script>
