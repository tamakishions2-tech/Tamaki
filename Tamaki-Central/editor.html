<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor · Tamaki Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Bebas+Neue&family=Chakra+Petch:wght@400;500;600;700&family=Pacifico&family=Permanent+Marker&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECE9E1;--panel:#FAF8F3;--panel2:#DEDACE;--line:#CBC5B6;--ink:#1B1912;--mute:#6B6556;
  --gold:#D9A300;--gold-ink:#1A1400;--audio-d:#24706A;--txt:#6A50C9;--ovc:#5B5440;--stage:#4A473F;--stage-dot:rgba(255,255,255,.07);--danger:#C2412D;
  color-scheme:light;
  --topH:44px;--trH:42px;--gripH:14px;--toolsH:64px;--tlh:clamp(112px,23vh,210px);--side:clamp(300px,44vw,560px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110;--panel:#1C1B18;--panel2:#2A2823;--line:#38352E;--ink:#F3EFE3;--mute:#9C9686;
    --gold:#F2B705;--gold-ink:#1A1400;--audio-d:#2B6E68;--txt:#6B55C4;--ovc:#4A4536;--stage:#26241F;--stage-dot:rgba(255,255,255,.05);--danger:#E5533D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121110;--panel:#1C1B18;--panel2:#2A2823;--line:#38352E;--ink:#F3EFE3;--mute:#9C9686;
  --gold:#F2B705;--gold-ink:#1A1400;--audio-d:#2B6E68;--txt:#6B55C4;--ovc:#4A4536;--stage:#26241F;--stage-dot:rgba(255,255,255,.05);--danger:#E5533D;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{width:22px;height:22px;flex:none}
[hidden]{display:none!important}

.top{height:var(--topH);flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;background:var(--bg)}
.top a{display:flex;align-items:center;gap:2px;color:var(--ink);text-decoration:none;font-size:14px;padding:6px 4px}
.top h1{font-size:16px;font-weight:600;white-space:nowrap}
.top .ib{width:36px;height:36px}
@media (max-width:400px){.top a span{display:none}}
.top .sp{flex:1}
.resBtn{background:var(--panel2);border:0;border-radius:6px;padding:7px 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.resBtn svg{width:14px;height:14px}
.exportBtn{background:var(--gold);color:var(--gold-ink);border:0;border-radius:6px;padding:8px 12px;font-weight:700;font-size:14px}

.stage{flex:1 1 0;min-height:0;min-width:0;position:relative;background-color:var(--stage);background-image:radial-gradient(var(--stage-dot) 1px,transparent 1.2px);background-size:14px 14px;overflow:hidden}
/* o quadro do vídeo: tamanho exato da proporção, com borda e sombra para se separar do fundo */
#cv{position:absolute;left:14px;top:14px;width:calc(100% - 28px);height:calc(100% - 28px);object-fit:contain;display:block;touch-action:none;background:#000;outline:1px solid rgba(255,255,255,.42);box-shadow:0 0 0 5px rgba(0,0,0,.22),0 10px 30px rgba(0,0,0,.55)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
.empty button{background:none;border:1.5px dashed #6b6556;color:#F3EFE3;border-radius:10px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:15px}
.empty small{color:#9C9686;font-size:12px}

.transport{height:var(--trH);flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;background:var(--bg)}
.tl-l{display:flex;align-items:center;gap:6px}
#time{font-size:12px;font-variant-numeric:tabular-nums;color:var(--mute)}
#time b{color:var(--ink);font-weight:600}
.ib{background:none;border:0;width:38px;height:38px;display:grid;place-items:center;border-radius:6px}
.ib:disabled{opacity:.3}
.ib.on{color:var(--gold)}
.playBtn svg{width:26px;height:26px}
.ur{justify-self:end;display:flex;gap:2px}

.tlwrap{position:relative;height:var(--tlh);flex:none;background:var(--bg);min-height:0}
/* alça para trocar espaço entre prévia e linha do tempo */
.grip{height:var(--gripH);flex:none;display:grid;place-items:center;background:var(--bg);touch-action:none;cursor:ns-resize;position:relative}
.grip::before{content:"";position:absolute;left:0;right:0;top:-10px;bottom:-6px}
.grip i{width:44px;height:4px;border-radius:2px;background:var(--line);pointer-events:none;transition:background .15s,width .15s}
.grip.on i{background:var(--gold);width:64px}
#tl{position:absolute;inset:0;overflow:auto;scrollbar-width:none;overscroll-behavior:contain;scroll-behavior:auto}
#tl::-webkit-scrollbar{display:none}
#tlInner{position:relative;min-height:100%}
.playhead{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);pointer-events:none;z-index:10}
.playhead::before{content:"";position:absolute;top:2px;left:-5px;width:10px;height:10px;background:var(--gold);transform:rotate(45deg)}
.tick{position:absolute;top:3px;font-size:10px;color:var(--mute);transform:translateX(-50%);font-variant-numeric:tabular-nums;pointer-events:none}
.dot{position:absolute;top:10px;width:3px;height:3px;border-radius:50%;background:var(--line);transform:translateX(-50%);pointer-events:none}
.beat{position:absolute;top:16px;width:6px;height:6px;border-radius:50%;background:var(--gold);transform:translateX(-50%);pointer-events:none}
.trkhd{position:absolute;top:24px;height:52px;display:flex;gap:6px}
.hdb{width:58px;height:52px;border:0;border-radius:6px;background:var(--panel2);font-size:10px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink);padding:2px;text-align:center}
.hdb svg{width:18px;height:18px}
.hdb.on{color:var(--gold)}
.hdb.cov{background-size:cover;background-position:center;color:#fff;text-shadow:0 1px 3px #000}
.rowic{position:absolute;width:22px;height:22px;color:var(--mute);display:grid;place-items:center;pointer-events:none}
.rowic svg{width:16px;height:16px}
.clip{position:absolute;top:24px;height:52px;border-radius:6px;overflow:hidden;background:var(--panel2)}
.blk{position:absolute;height:26px;border-radius:5px;overflow:hidden}
.blk.ov{background:var(--ovc)}.blk.tx{background:var(--txt)}.blk.au{background:var(--audio-d)}
.blk .th{position:absolute;inset:0;background-size:auto 100%;background-repeat:repeat-x;opacity:.75;pointer-events:none}
.blk canvas{position:absolute;left:0;top:0;height:100%;pointer-events:none}
.blk .nm{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:11px;color:#fff;white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.blk.sel .nm{left:18px}
.clip.sel,.blk.sel{z-index:3}
.blk.sel{touch-action:none}
.clip.sel::after,.blk.sel::after{content:"";position:absolute;inset:0;border:2px solid var(--gold);border-radius:inherit;pointer-events:none;z-index:2}
.kfd{position:absolute;top:50%;width:9px;height:9px;background:#fff;border:1.5px solid #1A1400;transform:translate(-50%,-50%) rotate(45deg);z-index:5;pointer-events:none}
.frames{display:flex;height:100%;pointer-events:none}
.frames img{height:100%;object-fit:cover;flex:none;pointer-events:none;display:block}
.frames.img{background-size:auto 100%;background-repeat:repeat-x;width:100%}
.frames.load{width:100%;background:repeating-linear-gradient(90deg,var(--panel2) 0 30px,var(--line) 30px 32px)}
.badges{position:absolute;left:4px;bottom:3px;display:flex;gap:3px;pointer-events:none;z-index:1}
.clip.sel .badges{left:20px}
.badges span{font-size:10px;background:rgba(0,0,0,.62);color:#fff;padding:1px 5px;border-radius:3px;white-space:nowrap}
.h{position:absolute;top:0;bottom:0;width:16px;background:var(--gold);z-index:4;touch-action:none;display:grid;place-items:center}
.blk .h{width:14px}
.h::before{content:"";width:2px;height:40%;border-radius:1px;background:var(--gold-ink)}
.h.l{left:0}.h.r{right:0}
.trbtn{position:absolute;top:39px;width:22px;height:22px;transform:translateX(-50%);border:0;border-radius:4px;background:var(--ink);color:var(--bg);z-index:5;display:grid;place-items:center;padding:0}
.trbtn svg{width:14px;height:14px}
.trbtn.on{background:var(--gold);color:var(--gold-ink)}
.trbtn i{width:2px;height:10px;background:currentColor;display:block}
.addclip{position:absolute;top:32px;width:36px;height:36px;border-radius:6px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.pill{position:absolute;height:26px;padding:0 12px;border:0;border-radius:5px;background:var(--panel2);color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill svg{width:14px;height:14px}

.tools{height:var(--toolsH);flex:none;display:flex;overflow-x:auto;gap:2px;padding:6px 8px;background:var(--panel);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools button{flex:none;min-width:60px;max-width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;line-height:1.15;text-align:center;background:none;border:0;padding:4px 3px;border-radius:8px}
.tools button:active{background:var(--panel2)}
.tools button.back{min-width:40px;background:var(--panel2);margin-right:6px}
.tools .sep{flex:none;width:1px;background:var(--line);margin:10px 4px}
.tools button.danger{color:var(--danger)}
body.sheetOn .stage{flex:none;height:var(--stageOpen,40vh)}
body.sheetOn .tlwrap{flex:1 1 0;height:auto}
body.fs .tlwrap,body.fs .tools,body.fs .top,body.fs .grip{display:none!important}
body.fs #cv{outline:0;box-shadow:none}
body.fs .stage{background:#000}

.sheet{display:none;position:fixed;left:0;right:0;bottom:calc(var(--toolsH) + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:10px 16px 16px;z-index:20;max-height:min(52vh,calc(100dvh - var(--toolsH) - var(--topH) - 120px));overflow-y:auto;overscroll-behavior:contain;box-shadow:0 -10px 30px rgba(0,0,0,.3)}
.sheet.open{display:block;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheetHead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin-bottom:10px;position:sticky;top:-10px;background:var(--panel);padding:4px 0;z-index:2}
.sheetHead span{font-weight:600;font-size:15px;text-align:center}
.sheetHead #sheetPlay{grid-column:1}
.sheetHead #sheetPlay svg{width:20px;height:20px}
.sheetHead button{grid-column:3;background:none;border:0;width:40px;height:34px;display:grid;place-items:center;color:var(--ink)}
.lab{font-size:12px;color:var(--mute);margin:14px 0 8px}
#sheetBody>.lab:first-child{margin-top:0}
.hint{font-size:12px;color:var(--mute);margin:10px 0 0;line-height:1.45}
.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:8px 0;color:var(--mute);font-size:14px}
.tabs button.on{color:var(--ink);border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips+.chips,.sl+.chips,.chips+.sl{margin-top:12px}
.chip{padding:8px 13px;border-radius:6px;background:var(--panel2);border:1.5px solid transparent;font-size:13px}
.chip.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--panel2))}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.row::-webkit-scrollbar{display:none}
.tile{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;font-size:11px;line-height:1.15;text-align:center}
.tile .ic{width:58px;height:50px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;border:2px solid transparent}
.tile.on .ic{border-color:var(--gold)}
.tile.on{color:var(--gold)}
.tile .ic svg{width:40px;height:30px}
.colors{align-items:center}
.cdot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.cdot.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--gold)}
.colors input[type=color]{width:34px;height:34px;border:0;background:none;padding:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px}
.fgrid button{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
.fgrid .sw{width:62px;height:62px;border-radius:7px;background:#333 center/cover no-repeat;border:2px solid transparent}
.fgrid button.on .sw{border-color:var(--gold)}
.sl{display:flex;align-items:center;gap:10px;min-height:38px}
.sl span{width:92px;font-size:13px;color:var(--mute);flex:none}
.sl input{flex:1;min-width:0;accent-color:var(--gold);height:28px}
.sl output{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.marks{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);padding:0 62px 0 102px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.allBtn{background:none;border:1.5px solid var(--line);border-radius:6px;padding:8px 12px;font-size:13px}
.priBtn{margin-top:14px;width:100%;background:var(--gold);color:var(--gold-ink);border:0;border-radius:8px;padding:11px;font-weight:700}
textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;padding:10px;resize:vertical;user-select:text;-webkit-user-select:text}
textarea:focus{outline:none;border-color:var(--gold)}
.bigBtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bigBtns button{background:var(--panel2);border:0;border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;text-align:center}
.bigBtns svg{width:26px;height:26px}
.aiChk{display:flex;align-items:center;gap:8px;font-size:13px;margin:12px 0 10px;color:var(--ink)}
.aiChk input{width:18px;height:18px;accent-color:var(--gold)}
.aiMsg{font-size:12px;line-height:1.5;margin-top:10px;color:var(--mute);white-space:pre-line;user-select:text;-webkit-user-select:text}
.aiMsg.warn{color:var(--danger)}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.emo button{font-size:28px;background:var(--panel2);border:0;border-radius:8px;height:52px}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tpl button{height:64px;border-radius:8px;border:0;background:#2b2a26;font-size:22px;overflow:hidden;white-space:nowrap}
#curveCv{width:100%;height:150px;background:var(--panel2);border-radius:8px;touch-action:none;margin-top:12px;display:block}
.recWrap{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}
.recBtn{width:76px;height:76px;border-radius:50%;border:4px solid var(--ink);background:var(--danger);color:#fff;font-weight:700;font-size:13px}
.recBtn.on{border-radius:18px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.7}}
.lyr{display:flex;flex-direction:column;gap:6px}
.lyrRow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 6px 6px 6px;border-radius:8px;background:var(--panel2);border:1.5px solid transparent}
.lyrRow.on{border-color:var(--gold)}
.lyrRow.off .lyrTh,.lyrRow.off .lyrNm{opacity:.4}
.lyrTh{width:44px;height:44px;border-radius:6px;background:#2b2a26 center/cover no-repeat;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;overflow:hidden}
.lyrTh.tx{background:var(--txt)}
.lyrNm{background:none;border:0;padding:0;text-align:left;min-width:0;display:flex;flex-direction:column;gap:2px}
.lyrNm b{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyrNm small{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.lyrAct{display:flex;gap:2px}
.lyrAct button{width:34px;height:34px;border:0;border-radius:6px;background:none;display:grid;place-items:center;color:var(--ink);padding:0}
.lyrAct button:disabled{opacity:.25}
.lyrAct svg{width:18px;height:18px}
.lyrBase{opacity:.75}
.lyrTag{font-size:11px;color:var(--mute);text-align:center;margin:2px 0}
.keys{display:flex;flex-direction:column}
.keyRow{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.keyRow span{flex:1;font-size:13px;line-height:1.3}
.keyBtn{min-width:76px;height:32px;padding:0 10px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel2);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.keyBtn.wait{border-color:var(--gold);color:var(--gold);animation:pulse 1.2s ease-in-out infinite}
.keyBtn.none{color:var(--mute);font-weight:400}
.keyClr{width:32px;height:32px;border:0;background:none;color:var(--mute);display:grid;place-items:center;padding:0}
.keyClr svg{width:16px;height:16px}
.keyGrp{font-size:12px;color:var(--mute);margin:16px 0 2px}
.coverPrev{width:100%;max-height:160px;object-fit:contain;border-radius:8px;background:#000;display:block}

#hold{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden}
#hold video,#hold audio{width:2px;height:2px}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;place-items:center;padding:20px}
#ov.on{display:grid}
.box{background:var(--panel);border-radius:12px;padding:20px;width:min(92vw,360px);text-align:center}
.box h2{font-size:17px;font-weight:600;margin-bottom:6px}
.box p{font-size:13px;color:var(--mute);line-height:1.45}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:16px 0}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.box .acts{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.box .acts a,.box .acts button{border:0;border-radius:6px;padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none;background:var(--panel2);color:var(--ink)}
.box .acts .pri{background:var(--gold);color:var(--gold-ink)}
/* tela Redimensionar (recortar) */
#selCv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cropUI{position:fixed;inset:0;z-index:40;background:#0d0d0c;color:#F3EFE3;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#cropUI.on{display:flex}
.cHead{height:46px;flex:none;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.cHead span{text-align:center;font-size:14px;color:#cfcac0}
.cHead button{background:none;border:0;color:#F3EFE3;height:46px;display:grid;place-items:center}
.cStage{flex:1 1 0;min-height:0;position:relative;background:#111110;touch-action:none}
#cropCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cScrub{flex:none;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 18px;font-size:13px;color:#cfcac0;font-variant-numeric:tabular-nums;max-width:560px;width:100%;margin:0 auto}
.cScrub input{width:100%;accent-color:#F3EFE3}
.cPanel{flex:none;background:#1a1a18;padding:0 20px 14px}
.cTabs{display:flex;gap:44px;border-bottom:1px solid #2c2b27;padding:0 10px}
.cTabs span{padding:12px 0 10px;font-size:14px;color:#8f8a80;border-bottom:2px solid transparent}
.cTabs span.on{color:#F3EFE3;font-weight:600;border-color:#F2B705}
.cLab{font-size:12px;font-weight:600;margin:14px 0 4px;color:#F3EFE3}
.dialWrap{position:relative;height:62px;max-width:640px;margin:0 auto;touch-action:none;cursor:ew-resize}
.dialVal{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:12px;font-weight:600}
.dial{position:absolute;left:0;right:0;top:18px;height:44px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.dialStrip{position:absolute;top:0;height:100%;left:0}
.dialStrip i{position:absolute;top:2px;width:1px;height:12px;background:#77736b}
.dialStrip i.mj{height:18px;top:0;background:#cfcac0}
.dialStrip b{position:absolute;top:26px;font-size:10px;font-weight:400;color:#8f8a80;transform:translateX(-50%)}
.dialMid{position:absolute;left:50%;top:16px;width:2px;height:22px;margin-left:-1px;background:#F2B705;border-radius:1px}
.ratios{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 0 6px}
.ratios::-webkit-scrollbar{display:none}
.ratios button{flex:none;min-width:52px;background:none;border:0;color:#cfcac0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;line-height:1.15;padding:0}
.ratios .rb{width:48px;height:48px;border-radius:8px;background:#2a2925;display:grid;place-items:center;border:2px solid transparent}
.ratios .rb i{display:block;border:1.6px solid #cfcac0;border-radius:2px}
.ratios button.on .rb{border-color:#F3EFE3;background:#1a1a18}
.ratios button.on{color:#F3EFE3}
.cReset{margin-top:6px;background:none;border:1px solid #3a3933;border-radius:6px;color:#cfcac0;font-size:12px;padding:6px 10px;display:inline-flex;align-items:center;gap:4px}
.cReset svg{width:14px;height:14px}
@media (max-height:520px){.cPanel{padding-bottom:6px}.cLab{margin-top:8px}}
@media (orientation:landscape) and (min-width:560px){
  body{display:grid;grid-template-columns:minmax(0,1fr) var(--side);grid-template-rows:var(--topH) var(--trH) minmax(0,1fr) var(--toolsH);grid-template-areas:"stage top" "stage tr" "stage tl" "stage tools"}
  .top{grid-area:top;min-width:0;overflow:hidden}.top a span{display:none}
  .stage{grid-area:stage}.transport{grid-area:tr}.tools{grid-area:tools}
  .tlwrap{grid-area:tl;height:auto}
  body.sheetOn .stage{height:auto}
  .grip{display:none}
  .tools,.transport,.tlwrap{min-width:0}
  .sheet{left:auto;right:0;width:var(--side);max-height:calc(100dvh - var(--toolsH) - var(--topH) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:14px 0 0 0}
  @media (max-width:900px){.top h1{display:none}}
  body.fs{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--trH);grid-template-areas:"stage" "tr"}
}
@media (prefers-reduced-motion: reduce){.sheet.open,.recBtn.on,.keyBtn.wait{animation:none}#toast{transition:none}.grip i{transition:none}}
.rcb{display:flex;flex-direction:column;gap:8px}
.rc{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(127,127,127,.12)}
.rc .ri{font-size:1.4rem}.rc .rt{flex:1;min-width:0;display:flex;flex-direction:column}.rc .rt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rc small{opacity:.7}.rc em{color:#F2B705;font-style:normal;font-weight:700}

<body>

<header class="top">
  <a href="./" id="backLink" aria-label="Voltar para a Central"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span>Central</span></a>
  <h1>Editor</h1>
  <span class="sp"></span>
  <button class="ib" id="fullBtn" aria-label="Tela inteira" hidden></button>
  <button class="resBtn" id="resBtn" aria-label="Configurações de exportação"></button>
  <button class="exportBtn" id="exportBtn">Exportar</button>
</header>

<main class="stage">
  <canvas id="cv" width="720" height="1280"></canvas>
  <canvas id="selCv" aria-hidden="true"></canvas>
  <div class="empty" id="empty">
    <button data-act="addMedia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Adicionar vídeos ou fotos
      <small>Depois é só tocar no clipe para editar</small>
    </button>
  </div>
</main>

<div class="grip" id="grip" role="separator" aria-orientation="horizontal" aria-label="Arraste para aumentar ou diminuir a prévia" tabindex="0"><i></i></div>

<div class="transport">
  <div class="tl-l"><button class="ib" id="fsBtn" aria-label="Prévia em tela cheia"></button><span id="time"><b>00:00</b> / 00:00</span></div>
  <button class="ib playBtn" id="playBtn" aria-label="Reproduzir"></button>
  <div class="ur">
    <button class="ib" id="kfBtn" aria-label="Quadro-chave" disabled></button>
    <button class="ib" id="undoBtn" aria-label="Desfazer" disabled></button>
    <button class="ib" id="redoBtn" aria-label="Refazer" disabled></button>
  </div>
</div>

<div class="tlwrap">
  <div id="tl"><div id="tlInner"></div></div>
  <div class="playhead"></div>
</div>

<nav class="tools" id="tools"></nav>

<div class="sheet" id="sheet" role="dialog" aria-labelledby="sheetTitle">
  <div class="sheetHead"><button id="sheetPlay" aria-label="Reproduzir"></button><span id="sheetTitle"></span><button id="sheetClose" aria-label="Concluir"></button></div>
  <div id="sheetBody"></div>
</div>

<input type="file" id="fMedia" accept="video/*,image/*" multiple hidden>
<input type="file" id="fAudio" accept="audio/*" multiple hidden>
<input type="file" id="fExtract" accept="video/*" multiple hidden>
<input type="file" id="fOverlay" accept="video/*,image/*" multiple hidden>
<input type="file" id="fReplace" accept="video/*,image/*" hidden>
<div id="cropUI" role="dialog" aria-label="Redimensionar">
  <div class="cHead"><button id="cropX" aria-label="Cancelar"></button><span>Redimensionar</span><button id="cropOk" aria-label="Aplicar"></button></div>
  <div class="cStage" id="cStage"><canvas id="cropCv"></canvas></div>
  <div class="cScrub" id="cScrub"><span id="cCur">00:00</span><input type="range" id="cTime" min="0" max="1" step="0.01" value="0" aria-label="Posição na mídia"><span id="cTot">00:00</span></div>
  <div class="cPanel">
    <div class="cTabs"><span class="on">Recortar</span></div>
    <p class="cLab">Girar</p>
    <div class="dialWrap" id="dialWrap"><span class="dialVal" id="dialVal">0°</span><div class="dial"><div class="dialStrip" id="dialStrip"></div></div><span class="dialMid"></span></div>
    <p class="cLab">Proporção de tela</p>
    <div class="ratios" id="cRatios"></div>
    <button class="cReset" id="cReset"></button>
  </div>
</div>
<div id="hold"></div>
<div id="toast" role="status"></div>
<div id="ov"><div class="box" id="ovBox"></div></div>

/* ---- tempo: velocidade normal e curva ---- */
function ptsVal(p,u){const x=clamp(u,0,1)*4,i=Math.min(3,Math.floor(x)),f=x-i,e=(1-Math.cos(f*Math.PI))/2;return p[i]+(p[i+1]-p[i])*e;}
const curveSpd=(p,u)=>Math.pow(10,ptsVal(p,u));
const hasCurve=it=>!!(it.curve&&!isImg(it));
function ctab(it){
  const L=it.out-it.in,key=L.toFixed(4)+'|'+it.curve.join(',');let t=CURVE.get(key);if(t)return t;
  const N=200,T=new Float64Array(N+1);for(let i=0;i<N;i++)T[i+1]=T[i]+(L/N)/curveSpd(it.curve,(i+.5)/N);
  t={T,N,L};if(CURVE.size>300)CURVE.clear();CURVE.set(key,t);return t;
}
function vLen(it){if(isImg(it))return it.out-it.in;if(hasCurve(it))return ctab(it).T[200];return (it.out-it.in)/it.speed;}
function l2m(it,local){
  if(isImg(it))return it.in+local;
  if(!hasCurve(it))return it.in+local*it.speed;
  const {T,N,L}=ctab(it);local=clamp(local,0,T[N]);let lo=0,hi=N;
  while(hi-lo>1){const mid=(lo+hi)>>1;if(T[mid]<=local)lo=mid;else hi=mid;}
  return it.in+((lo+(local-T[lo])/((T[hi]-T[lo])||1))/N)*L;
}
function m2l(it,mt){
  if(isImg(it))return mt-it.in;
  if(!hasCurve(it))return (mt-it.in)/it.speed;
  const {T,N,L}=ctab(it),u=clamp((mt-it.in)/L,0,1)*N,i=Math.min(N-1,Math.floor(u));return T[i]+(T[i+1]-T[i])*(u-i);
}
function rateAt(it,local){if(!hasCurve(it))return it.speed;return curveSpd(it.curve,(l2m(it,local)-it.in)/(it.out-it.in));}
const cDur=vLen,oDur=vLen;
function itemDur(k,it){return k==='clip'||k==='ov'?vLen(it):k==='audio'?it.out-it.in:it.dur;}
function layout(){let s=0;return S.clips.map((c,i)=>{const o={c,i,start:s,dur:cDur(c)};s+=o.dur;return o;});}
function itemStart(k,it){return k==='clip'?layout().find(l=>l.c===it).start:it.start;}
function videoEnd(){return S.clips.reduce((a,c)=>a+cDur(c),0);}
function totalDur(){
  let e=videoEnd();
  for(const o of S.ovs)e=Math.max(e,o.start+oDur(o));
  for(const t of S.texts)e=Math.max(e,t.start+t.dur);
  for(const a of S.audios)e=Math.max(e,a.start+(a.out-a.in));
  return e;
}
function clipAt(t){for(const l of layout())if(t>=l.start&&t<l.start+l.dur)return l;return null;}
function frameAt(t){
  const at=clipAt(t);if(at)return at;
  const L=layout();if(L.length&&!S.playing&&Math.abs(t-videoEnd())<1e-3)return L[L.length-1];
  return null;
}

  const b=tfOf(k,it),base={x:b.x,y:b.y,s:b.s??1,r:b.r,op:it.op},K=it.kf;
  if(!K||!K.length)return base;
  if(local<=K[0].t)return {...K[0]};
  const last=K[K.length-1];if(local>=last.t)return {...last};
  for(let i=0;i<K.length-1;i++){const a=K[i],c=K[i+1];if(local<=c.t){const p=ease((local-a.t)/((c.t-a.t)||1)),o={};for(const q of KFK)o[q]=a[q]+(c[q]-a[q])*p;return o;}}
  return base;
}

function ensureAC(){
  try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();REC=AC.createMediaStreamDestination();}
  if(AC.state==='suspended')AC.resume();}catch(e){}
}
function wire(m){
  if(!AC||m.ch||!m.el||m.type==='image'||m.type==='seq')return;
  try{
    const src=AC.createMediaElementSource(m.el);
    const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=10;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=20000;
    const sh=AC.createWaveShaper(),ring=AC.createGain(),osc=AC.createOscillator(),depth=AC.createGain();
    osc.frequency.value=45;depth.gain.value=0;osc.connect(depth);depth.connect(ring.gain);osc.start();
    const dl=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain(),out=AC.createGain();fb.gain.value=0;wet.gain.value=0;
    src.connect(hp);hp.connect(lp);lp.connect(sh);sh.connect(ring);ring.connect(out);ring.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(out);
    out.connect(AC.destination);out.connect(REC);
    m.ch={hp,lp,sh,ring,depth,dl,fb,wet};m.gain=out;m.el.volume=1;m.fxKey='';
  }catch(e){}
}
const wireAll=()=>media.forEach(wire);
function setVol(m,v){if(m.gain)m.gain.gain.value=v;else if(m.el)m.el.volume=clamp(v,0,1);}
const DIST={};
function distCurve(k){if(DIST[k])return DIST[k];const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}return DIST[k]=c;}
function setAfx(m,nr,fx){
  if(!m.ch)return;const key=(nr?'1':'0')+fx;if(m.fxKey===key)return;m.fxKey=key;const c=m.ch;
  let hp=nr?90:10,lp=nr?8000:20000,dist=0,ring=false,d=.01,f=0,w=0;
  switch(fx){
    case 'echo':d=.28;f=.35;w=.45;break;
    case 'cave':d=.09;f=.6;w=.55;break;
    case 'radio':hp=Math.max(hp,500);lp=Math.min(lp,3200);dist=4;break;
    case 'phone':hp=Math.max(hp,850);lp=Math.min(lp,2600);break;
    case 'mega':hp=Math.max(hp,600);lp=Math.min(lp,4000);dist=25;break;
    case 'robot':ring=true;break;
    case 'deep':lp=Math.min(lp,900);break;
  }
  c.hp.frequency.value=hp;c.lp.frequency.value=lp;c.sh.curve=dist?distCurve(dist):null;
  c.ring.gain.value=ring?0:1;c.depth.gain.value=ring?1:0;c.dl.delayTime.value=d;c.fb.gain.value=f;c.wet.gain.value=w;
}

/* ================= mídia ================= */
function once(el,ev){return new Promise((res,rej)=>{el.addEventListener(ev,res,{once:true});el.addEventListener('error',()=>rej(new Error('load')),{once:true});});}
async function loadSrc({url,name,type}){
  const m={id:uid(),type,name,url,dur:3};
  if(type==='image'){
    const img=new Image();img.src=url;await once(img,'load');m.el=img;
    m.thumb=await thumbOf(img,img.naturalWidth,img.naturalHeight);
  }else{
    const el=document.createElement(type);
    el.preload='auto';el.playsInline=true;el.setAttribute('playsinline','');el.src=url;
    $('#hold').appendChild(el);
    await once(el,'loadedmetadata');
    if(!isFinite(el.duration)){
      await new Promise(r=>{const t=setTimeout(r,2000);el.addEventListener('durationchange',()=>{if(isFinite(el.duration)){clearTimeout(t);r();}});el.currentTime=1e7;});
      el.currentTime=0;
    }
    m.dur=isFinite(el.duration)?el.duration:10;m.el=el;
    el.addEventListener('seeked',()=>{needDraw=true;cropDirty=true;});
    el.addEventListener('loadeddata',()=>needDraw=true);
    wire(m);
  }
  media.set(m.id,m);return m;
}
function loadMedia(file,force){
  const type=force||(file.type.startsWith('image/')?'image':file.type.startsWith('audio/')?'audio':'video');
  return loadSrc({url:URL.createObjectURL(file),name:file.name.replace(/\.[^.]+$/,''),type});
}
async function cloneMedia(m){
  if(m.type==='image'||m.type==='seq')return m;
  const n=await loadSrc({url:m.url,name:m.name,type:m.type});n.thumbs=m.thumbs;n.peaks=m.peaks;n.PR=m.PR;return n;
}
function thumbOf(src,w,h){
  const c=document.createElement('canvas');const H=80,W=Math.max(20,Math.round(H*w/h)||80);
  c.width=W;c.height=H;c.getContext('2d').drawImage(src,0,0,W,H);
  return new Promise(r=>c.toBlob(b=>r(URL.createObjectURL(b)),'image/jpeg',.7));
}
const thumbFor=m=>m.thumb||(m.thumbs&&m.thumbs[0])||'';
async function makeThumbs(m){
  if(m.thumbs)return;
  try{
    const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;v.src=m.url;
    await once(v,'loadeddata');
    const n=Math.max(2,Math.min(12,Math.ceil(m.dur/2)));const out=[];
    for(let k=0;k<n;k++){v.currentTime=Math.min(m.dur-.05,(k+.5)*m.dur/n);await once(v,'seeked');out.push(await thumbOf(v,v.videoWidth,v.videoHeight));}
    m.thumbs=out;v.removeAttribute('src');v.load();queueTL();
  }catch(e){}
}
async function makePeaks(m,blob){
  try{
    ensureAC();const ab=await AC.decodeAudioData(await blob.arrayBuffer());
    const ch=ab.getChannelData(0),PR=20,n=Math.ceil(ab.duration*PR),step=Math.floor(ab.sampleRate/PR);
    const p=new Float32Array(n);let max=0;
    for(let i=0;i<n;i++){let mx=0;const s=i*step,e=Math.min(ch.length,s+step);for(let j=s;j<e;j+=16){const v=Math.abs(ch[j]);if(v>mx)mx=v;}p[i]=mx;if(mx>max)max=mx;}
    if(max>0)for(let i=0;i<n;i++)p[i]/=max;
    m.peaks=p;m.PR=PR;queueTL();
  }catch(e){}
}

}

/* ================= reprodução ================= */
function wants(){
  const W=new Map(),at=frameAt(S.t);
  const vis=(it,local,main)=>{const m=mOf(it);if(!m||m.type!=='video')return;W.set(m.id,{time:l2m(it,local),rate:clamp(rateAt(it,local),.1,16),vol:main&&S.muteMain?0:it.vol,nr:it.nr,afx:it.afx,pitch:it.pitch});};
  if(at)vis(at.c,clamp(S.t-at.start,0,at.dur-.03),true);
  for(const o of S.ovs)if(activeAt(o.start,oDur(o)))vis(o,S.t-o.start,false);
  if(S.playing)for(const a of S.audios){
    const d=a.out-a.in;
    if(activeAt(a.start,d)){
      const local=S.t-a.start,fd=Math.min(1.5,d/3);let f=1;
      if(a.fadeIn&&local<fd)f=local/fd;
      if(a.fadeOut&&d-local<fd)f=Math.min(f,(d-local)/fd);
      W.set(a.m,{time:a.in+local,rate:1,vol:a.vol*f,nr:a.nr,afx:a.afx,pitch:false});
    }
  }
  return W;
}
function syncMedia(){
  const W=wants();
  for(const m of media.values()){
    if(m.type==='image'||m.type==='seq')continue;
    const el=m.el,w=W.get(m.id);
    if(!w){if(!el.paused)el.pause();continue;}
    if(Math.abs(el.playbackRate-w.rate)>.01)el.playbackRate=w.rate;
    if(el.preservesPitch===w.pitch)el.preservesPitch=!w.pitch;
    setVol(m,w.vol);setAfx(m,w.nr,w.afx);
    if(S.playing){
      if(Math.abs(el.currentTime-w.time)>.3*Math.max(1,w.rate)&&!el.seeking)el.currentTime=w.time;
      if(el.paused)el.play().catch(()=>{});
    }else{
      if(!el.paused)el.pause();
      if(Math.abs(el.currentTime-w.time)>.03&&!el.seeking)el.currentTime=w.time;
    }
  }
}
function advance(dt){
  const at=clipAt(S.t),m=at&&mOf(at.c);
  if(m&&m.type==='video'){
    const el=m.el,c=at.c,end=at.start+at.dur,local=S.t-at.start,exp=l2m(c,local),r=rateAt(c,local);
    if(el.seeking||Math.abs(el.currentTime-exp)>=.6*Math.max(1,r))return;
    if(el.ended||el.currentTime>=c.out-.02)S.t=end;
    else if(!el.paused&&el.readyState>=2){const tv=at.start+m2l(c,el.currentTime);if(tv>S.t)S.t=Math.min(tv,end);}
  }else S.t+=dt;

function tick(ts){
  const dt=lastTs?Math.min(.1,(ts-lastTs)/1000):0;lastTs=ts;
  if(S.playing){
    advance(dt);
    const tot=totalDur();
    if(S.t>=tot-.001){
      S.t=tot;pause();
      if(exporting&&exporting.rec.state==='recording')exporting.rec.stop();
      if(recState)stopRecord();
      if(asr)stopAutoCap();
    }
  }
  if(!cropState)syncMedia();
  const at=frameAt(S.t),id=at?at.c.id:null;
  if(id!==lastClipId){
    if(S.playing&&lastClipId&&id){snapCtx.drawImage(cv,0,0);snapFor=id;}else snapFor=null;
    lastClipId=id;needDraw=true;
  }
  if(cropState){if(cropDirty)drawCrop();}
  else if(S.playing||needDraw){draw(at);drawSel();needDraw=false;}
  if(S.playing)setScroll(S.t);
  if(exporting){const b=$('#exBar');if(b)b.style.width=(100*S.t/Math.max(.01,totalDur()))+'%';}
  updateTime();
  requestAnimationFrame(tick);
}
function play(){
  if(!S.clips.length&&!S.audios.length&&!S.ovs.length&&!S.texts.length)return toast('Adicione um vídeo, foto ou música primeiro');
  ensureAC();wireAll();
  if(S.t>=totalDur()-.05)seek(0);
  S.playing=true;lastClipId=frameAt(S.t)?.c.id??null;snapFor=null;updPlay();
}
function pause(){
  S.playing=false;
  for(const m of media.values())if(m.el&&m.type!=='image'&&!m.el.paused)m.el.pause();
  needDraw=true;updPlay();
}
function seek(t,noScroll){
  S.t=clamp(t,0,totalDur());snapFor=null;lastClipId=frameAt(S.t)?.c.id??null;needDraw=true;
  if(!noScroll)setScroll(S.t);updateTime();
}
function updPlay(){for(const b of [$('#playBtn'),$('#sheetPlay')]){b.innerHTML=svg(S.playing?ICON.pause:ICON.play);b.setAttribute('aria-label',S.playing?'Pausar':'Reproduzir');}}
let lastKfState='';
function updateTime(){
  $('#time').innerHTML=`<b>${fmt(S.t)}</b> / ${fmt(totalDur())}`;
  const it=selItem(),k=S.sel&&S.sel.kind,ok=!!it&&k!=='audio';
  let on=false;if(ok){const l=S.t-itemStart(k,it);on=(it.kf||[]).some(q=>Math.abs(q.t-l)<.05);}
  const st=ok+'|'+on;if(st===lastKfState)return;lastKfState=st;
  const b=$('#kfBtn');b.disabled=!ok;b.classList.toggle('on',on);b.innerHTML=svg(on?ICON.kfOn:ICON.kf);

  async extract(){
    const it=selItem(),k=S.sel.kind,m=mOf(it);if(!m||m.type!=='video')return;

      blobFromUrl(m.url).then(b=>makePeaks(am,b)).catch(()=>{});
      commit();S.audios.push(newAudio(am,{start:itemStart(k,it),in:it.in,out:it.out,vol:it.vol||1}));it.vol=0;

    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));

    commit();

  },
  async reverse(){
    const it=selItem(),m=mOf(it);if(!m||m.type!=='video')return;
    const L=it.out-it.in;if(L>30)return toast('O reverso funciona em trechos de até 30 s. Divida o clipe antes.');
    if(S.playing)pause();
    const fps=L>15?12:20,n=Math.max(2,Math.ceil(L*fps));

    try{
      const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;v.src=m.url;await once(v,'loadeddata');
      const sc=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight)),w=Math.round(v.videoWidth*sc),h=Math.round(v.videoHeight*sc),frames=[];

      v.removeAttribute('src');v.load();

      const nt=Math.min(8,n);for(let i=0;i<nt;i++)rm.thumbs.push(await thumbOf(frames[Math.floor(i*n/nt)],w,h));

    }catch(e){closeOverlay();toast('Não deu para inverter este clipe');}
  }

function toggleAutoCap(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast('Este navegador não tem reconhecimento de voz. Use o Chrome.');
  if(asr)return stopAutoCap();
  if(!S.clips.length&&!S.audios.length&&!S.ovs.length)return toast('Adicione um vídeo com fala primeiro');
  const r=new SR();r.lang='pt-BR';r.continuous=true;r.interimResults=true;
  asr={r,cur:null,n:0,run:true,stopping:false};commit();
  r.onresult=e=>{if(!asr)return;for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(asr.cur==null)asr.cur=Math.max(0,S.t-.8);if(res.isFinal){addCaptions(res[0].transcript,asr.cur,S.t);asr.cur=null;}}};
  r.onend=()=>{if(asr&&asr.run){try{r.start();}catch(e){}}};
  r.onerror=e=>{if(e.error==='not-allowed'){toast('Permita o microfone para gerar legendas');stopAutoCap();}};
  try{r.start();}catch(e){}
  if(S.t>=totalDur()-.1)seek(0);
  play();updAutoUI();
}
function addCaptions(text,st,en){
  const words=text.trim().split(/\s+/).filter(Boolean);if(!words.length)return;
  const chunks=[];for(let i=0;i<words.length;i+=6)chunks.push(words.slice(i,i+6).join(' '));
  const d=Math.max(.8,en-st)/chunks.length;
  chunks.forEach((c,i)=>S.texts.push(newText({...tplVals('legenda'),text:c,start:st+i*d,dur:d,y:.3})));
  asr.n+=chunks.length;renderTL();needDraw=true;
}
function stopAutoCap(){
  if(!asr||asr.stopping)return;asr.stopping=true;asr.run=false;if(S.playing)pause();updAutoUI();
  setTimeout(()=>{if(!asr)return;try{asr.r.stop();}catch(e){}const n=asr.n;asr=null;updAutoUI();toast(n?`${n} legendas geradas. Toque em cada uma para revisar.`:'Nenhuma fala reconhecida');},1200);
}

function startExport(){
  closeSheet();
  if(!S.clips.length&&!S.ovs.length)return toast('Adicione pelo menos um vídeo ou foto para exportar');
  if(!window.MediaRecorder||!cv.captureStream)return toast('Este navegador não grava vídeo. Abra no Chrome.');
  ensureAC();wireAll();setDims(S.exp.res);
  const stream=cv.captureStream(S.exp.fps);
  if(REC)REC.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const bps=BR[S.exp.res]*({low:.5,rec:1,high:1.6})[S.exp.br];
  let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:bps}:{});}catch(e){setDims(previewShort());return toast('Não foi possível iniciar a gravação.');}
  const ex={rec,chunks:[],mime,cancelled:false,lock:null};exporting=ex;
  if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{if(exporting===ex)ex.lock=l;else l.release().catch(()=>{});}).catch(()=>{});
  rec.ondataavailable=e=>{if(e.data&&e.data.size)ex.chunks.push(e.data);};
  rec.onstop=()=>{
    exporting=null;stream.getVideoTracks().forEach(t=>t.stop());setDims(previewShort());
    if(ex.lock){ex.lock.release().catch(()=>{});ex.lock=null;}
    if(ex.cancelled){closeOverlay();return;}
    const type=(ex.mime||'video/webm').split(';')[0];
    showDone(new Blob(ex.chunks,{type}),type.includes('mp4')?'mp4':'webm');
  };
  select(null);
  overlay(`<h2>Exportando em ${RES[S.exp.res]}</h2><p>O vídeo é gravado em tempo real. Deixe a tela ligada e o app aberto até terminar.</p><div class="bar"><i id="exBar"></i></div><div class="acts"><button id="exCancel">Cancelar</button></div>`);
  $('#exCancel').onclick=()=>{ex.cancelled=true;pause();if(rec.state==='recording')rec.stop();};
  seek(0);rec.start(500);play();
}
function showDone(blob,ext){
  const d=new Date(),p=n=>String(n).padStart(2,'0'),stamp=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
  const name=`video-${stamp}.${ext}`,url=URL.createObjectURL(blob),file=new File([blob],name,{type:blob.type});
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[file]}));
  overlay(`<h2>Vídeo pronto</h2><p>${name}, ${(blob.size/1048576).toFixed(1)} MB${ext==='webm'?'<br>Formato WebM: o YouTube aceita direto. Se outro app recusar, converta para MP4.':''}</p><div class="acts"><a class="pri" href="${url}" download="${name}">Baixar vídeo</a>${S.cover?`<a href="${S.cover}" download="capa-${stamp}.jpg">Baixar capa</a>`:''}${canShare?'<button id="shBtn">Compartilhar</button>':''}<button id="ovClose">Fechar</button></div>`);

/* ===== Biblioteca da Tamaki Central =====
   Guarda gravações no próprio aparelho (IndexedDB "tamaki-biblioteca").
   Todas as abas no mesmo site (tamakishions2-tech.github.io) enxergam a mesma biblioteca. */
const TamakiBib={
  abrir(){return new Promise((ok,no)=>{const r=indexedDB.open('tamaki-biblioteca',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('itens'))db.createObjectStore('itens',{keyPath:'id'});};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});},
  async salvar(blob,o={}){
    if(!window.indexedDB||!blob||!blob.size)throw new Error('vazio');
    const mime=(blob.type||'').split(';')[0],tipo=mime.startsWith('audio/')?'audio':mime.startsWith('image/')?'imagem':'video';
    const it={id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),origem:o.origem||'outro',tipo,nome:o.nome||'Gravação',texto:o.texto||'',mime,tamanho:blob.size,criado:Date.now(),blob};
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
    const db=await this.abrir();
    await new Promise((ok,no)=>{const tx=db.transaction('itens','readwrite');tx.objectStore('itens').put(it);tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error);});
    db.close();
    try{const c=new BroadcastChannel('tamaki-biblioteca');c.postMessage({novo:it.id});c.close();}catch(_){}
    return it.id;
  },
  async ler(id){
    const db=await this.abrir();
    const r=await new Promise((ok,no)=>{const q=db.transaction('itens').objectStore('itens').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);});
    db.close();return r;
  }
};

  const p=[];if(e.ctrlKey||e.metaKey)p.push('Ctrl');if(e.altKey)p.push('Alt');
  if(e.shiftKey&&(k.length>1||/[A-Z0-9 ]/.test(k)))p.push('Shift');
  return [...p,k].join('+');

/* ================= ponte com o Claude =================
   "Copiar para o Claude" gera um resumo do projeto (mídias + receita atual).
   "Aplicar receita" lê o JSON que o Claude devolve e monta a linha do tempo.

const AI_V=1;
const aiNorm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const aiR=v=>Math.round(v*10)/10;
function aiParseT(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return isFinite(v)?v:null;
  const p=String(v).trim().replace(',','.').split(':').map(Number);
  if(p.some(x=>!isFinite(x)))return null;
  return p.reduce((a,x)=>a*60+x,0);
}
function aiMedia(){
  const seen=new Set(),out=[];
  for(const m of media.values()){const key=m.url||m.id;if(seen.has(key))continue;seen.add(key);out.push(m);}
  return out;
}
const aiIdx=(L,m)=>m?L.findIndex(x=>(x.url||x.id)===(m.url||m.id))+1:0;
function aiKey(dict,v,nameOf,warn,what){
  if(v==null||v===''||v===false)return 'none';
  const n=aiNorm(v);
  for(const [k,val] of Object.entries(dict)){if(aiNorm(k)===n||aiNorm(nameOf(val))===n)return k;}
  warn.push(`${what}: “${v}” não existe, ficou sem.`);return 'none';
}
const TYPE_N={video:'vídeo',image:'foto',audio:'áudio',seq:'congelado'};

async function aiSilences(m){
  if(m.sil!==undefined)return m.sil;
  if((m.type!=='video'&&m.type!=='audio')||m.dur>180)return null;
  m.sil=null;
  try{
    ensureAC();
    const ab=await AC.decodeAudioData(await (await fetch(m.url)).arrayBuffer());
    const ch=ab.getChannelData(0),win=Math.floor(ab.sampleRate*.05),n=Math.floor(ch.length/win),r=new Float32Array(n);
    for(let i=0;i<n;i++){let a=0,c=0;for(let j=i*win;j<(i+1)*win;j+=4){a+=ch[j]*ch[j];c++;}r[i]=Math.sqrt(a/c);}
    const sorted=[...r].sort((a,b)=>a-b),thr=Math.max(.006,sorted[Math.floor(n*.9)]*.12);
    const out=[];let s=-1;
    for(let i=0;i<=n;i++){
      const q=i<n&&r[i]<thr;
      if(q&&s<0)s=i;
      if(!q&&s>=0){if(i-s>=10)out.push([aiR(s*.05),aiR(i*.05)]);s=-1;}
    }
    m.sil=out.slice(0,40);
  }catch(e){m.sil=null;}
  return m.sil;
}

function aiCurrent(L){
  const anim=a=>{if(!a)return;const o={};if(a.in!=='none')o.entrada=a.in;if(a.out!=='none')o.saida=a.out;if(a.combo&&a.combo!=='none')o.combo=a.combo;return Object.keys(o).length?o:undefined;};
  const clipes=S.clips.map(c=>{
    const m=mOf(c),o={midia:aiIdx(L,m)};
    if(m&&(m.type==='image'))o.duracao=aiR(c.out-c.in);else{o.de=aiR(c.in);o.ate=aiR(c.out);}
    if(c.speed!==1&&!c.curve)o.velocidade=aiR(c.speed*100)/100;
    if(c.curve)o.curva=c.curveName;
    if(c.vol!==1)o.volume=aiR(c.vol);
    if(c.tr&&c.tr.type!=='none')o.transicao={tipo:c.tr.type,dur:aiR(c.tr.dur)};
    if(c.filter!=='none'){o.filtro=c.filter;if(c.fk!==1)o.intensidade=aiR(c.fk);}
    if(c.fx!=='none')o.efeito=c.fx;
    if(c.fit!=='contain')o.encaixe=c.fit;
    const aj={};for(const [k,v] of Object.entries(c.adj||{}))if(v)aj[k]=v;if(Object.keys(aj).length)o.ajuste=aj;
    const an=anim(c.anim);if(an)o.animacao=an;
    if(c.afx!=='none')o.efeitoAudio=c.afx;if(c.nr)o.reduzirRuido=true;
    return o;
  });
  const audios=S.audios.map(a=>{
    const o={midia:aiIdx(L,mOf(a)),inicio:aiR(a.start),de:aiR(a.in),ate:aiR(a.out)};
    if(a.vol!==1)o.volume=aiR(a.vol);if(a.fadeIn)o.fadeIn=true;if(a.fadeOut)o.fadeOut=true;
    if(a.afx!=='none')o.efeitoAudio=a.afx;if(a.nr)o.reduzirRuido=true;return o;
  });
  const textos=S.texts.map(t=>{
    const o={texto:t.text,inicio:aiR(t.start),duracao:aiR(t.dur),fonte:t.font,tamanho:t.size,cor:t.color,x:aiR(t.x*100)/100,y:aiR(t.y*100)/100};
    const an=anim(t.anim);if(an)o.animacao=an;return o;
  });
  return {versao:AI_V,modo:'substituir',proporcao:S.ratio,silenciarClipes:S.muteMain,clipes,audios,textos};
}

async function aiSummary(withSil){
  const L=aiMedia(),out=[`[Editor Tamaki → Claude] v${AI_V}`,`Proporção ${S.ratio} · duração atual ${fmtS(totalDur())}`];
  if(S.ovs.length)out.push(`Camadas: ${S.ovs.length} (a receita não mexe nelas)`);
  out.push('','MÍDIAS (use o número em "midia")');
  if(!L.length)out.push('(nenhuma mídia carregada)');
  for(let i=0;i<L.length;i++){
    const m=L[i];let line=`${i+1}. "${m.name}" · ${TYPE_N[m.type]||m.type}`;
    if(m.type!=='image')line+=` · ${fmtS(m.dur||0)}`;
    try{if(m.type==='video'||m.type==='image'||m.type==='seq'){const [w,h]=srcSize(m);if(w)line+=` · ${w}x${h}`;}}catch(e){}
    if(withSil&&(m.type==='video'||m.type==='audio')){
      const sil=await aiSilences(m);
      if(sil)line+=sil.length?` · silêncios: ${sil.map(([a,b])=>a+'–'+b).join(', ')}`:' · sem silêncios longos';
      else if(m.dur>180)line+=' · (longo demais para medir silêncios)';
    }
    out.push(line);
  }
  out.push('','RECEITA ATUAL',JSON.stringify(aiCurrent(L)),'','PEDIDO: ');
  return out.join('\n');
}

function aiExtract(txt){
  let t=String(txt).replace(/```(?:json)?/gi,'');
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<a)throw new Error('Não achei a receita no texto. Cole a resposta inteira do Claude.');
  t=t.slice(a,b+1).replace(/[“”]/g,'"').replace(/,\s*([}\]])/g,'$1');
  try{return JSON.parse(t);}catch(e){throw new Error('A receita está com erro de formatação. Peça ao Claude para mandar de novo.');}
}

function aiAnim(src,warn,what){
  const a=ANIM0();if(!src)return a;
  if(typeof src==='string')src={entrada:src};
  if(src.entrada)a.in=aiKey(ANIM_N,src.entrada,x=>x,warn,what+' animação');
  if(src.saida)a.out=aiKey(ANIM_N,src.saida,x=>x,warn,what+' animação');
  if(src.combo)a.combo=aiKey(COMBO_N,src.combo,x=>x,warn,what+' animação');
  const d=aiParseT(src.duracao);if(d)a.inD=a.outD=clamp(d,.1,5);
  return a;
}

async function aiApply(txt){
  const R=aiExtract(txt),L=aiMedia(),warn=[];
  const getM=(v,what)=>{
    if(v==null){warn.push(`${what}: faltou dizer a mídia.`);return null;}
    const n=Number(v);if(Number.isInteger(n)&&L[n-1])return L[n-1];
    const nm=aiNorm(v),hit=L.find(m=>aiNorm(m.name)===nm)||L.find(m=>aiNorm(m.name).includes(nm));
    if(!hit)warn.push(`${what}: a mídia “${v}” não está carregada no editor.`);
    return hit||null;
  };
  const add=aiNorm(R.modo)==='adicionar';
  const used=new Set(S.ovs.map(o=>o.m));
  if(add||!R.clipes)S.clips.forEach(x=>used.add(x.m));
  if(add||!R.audios)S.audios.forEach(x=>used.add(x.m));
  const clipClone=new Map();

  const clips=[];
  for(const [i,c] of (R.clipes||[]).entries()){
    const what=`Clipe ${i+1}`;let m=getM(c.midia??c.nome,what);if(!m)continue;
    if(m.type==='audio'){warn.push(`${what}: mídia ${c.midia} é só áudio; vai em "audios".`);continue;}
    if(used.has(m.id)&&m.type==='video'){if(!clipClone.has(m.id))clipClone.set(m.id,await cloneMedia(m));m=clipClone.get(m.id);}
    const it=newVisual(m,{tr:{type:'none',dur:.5}});
    if(m.type==='image'){
      const d=aiParseT(c.duracao)??((aiParseT(c.ate)??3)-(aiParseT(c.de)??0));it.in=0;it.out=clamp(d||3,.2,600);
    }else{
      const D=m.dur||3;let de=clamp(aiParseT(c.de)??0,0,Math.max(0,D-.1)),ate=clamp(aiParseT(c.ate)??D,0,D);
      if(ate-de<.1){warn.push(`${what}: corte de ${c.de} a ${c.ate} é curto demais ou passa do fim (${fmtS(D)}).`);ate=Math.min(D,de+.5);}
      it.in=de;it.out=ate;
    }
    if(c.velocidade!=null){const v=Number(c.velocidade);if(v>0)it.speed=clamp(v,.1,16);else warn.push(`${what}: velocidade inválida.`);}
    if(c.volume!=null)it.vol=clamp(Number(c.volume)>2?Number(c.volume)/100:Number(c.volume)||0,0,2);
    if(c.transicao){const tr=typeof c.transicao==='string'?{tipo:c.transicao}:c.transicao;it.tr={type:aiKey(TR_N,tr.tipo,x=>x,warn,what+' transição'),dur:clamp(aiParseT(tr.dur)??.5,.1,2)};}
    if(c.filtro){it.filter=aiKey(FILTERS,c.filtro,x=>x.n,warn,what+' filtro');if(c.intensidade!=null){const k=Number(c.intensidade);it.fk=clamp(k>1?k/100:k,0,1);}}
    if(c.efeito)it.fx=aiKey(FX,c.efeito,x=>x,warn,what+' efeito');
    if(c.encaixe)it.fit=/preench|cover/.test(aiNorm(c.encaixe))?'cover':'contain';
    if(c.ajuste&&typeof c.ajuste==='object')for(const [k,v] of Object.entries(c.ajuste)){
      const p=ADJ_P.find(q=>q[0]===k||aiNorm(q[1])===aiNorm(k));
      if(p)it.adj[p[0]]=clamp(Number(v)||0,p[2],p[3]);else warn.push(`${what} ajuste: “${k}” não existe.`);
    }
    if(c.animacao)it.anim=aiAnim(c.animacao,warn,what);
    if(c.efeitoAudio)it.afx=aiKey(AFX_N,c.efeitoAudio,x=>x,warn,what+' efeito de áudio');
    if(c.reduzirRuido)it.nr=true;
    if(m.type==='video')makeThumbs(m);
    clips.push(it);
  }

  const audios=[];
  for(const [i,a] of (R.audios||[]).entries()){
    const what=`Áudio ${i+1}`;let am=null;
    if(a.som){
      const q=aiKey(SFX,a.som,x=>x[0],warn,what+' som');if(q==='none')continue;
      try{ensureAC();const blob=await makeSfx(q);am=await loadSrc({url:URL.createObjectURL(blob),name:SFX[q][0],type:'audio'});makePeaks(am,blob);}catch(e){warn.push(`${what}: não deu para criar o som.`);continue;}
    }else{
      const m=getM(a.midia??a.nome,what);if(!m)continue;
      if(m.type==='image'||m.type==='seq'){warn.push(`${what}: mídia ${a.midia} é foto, não tem som.`);continue;}
      am=m.type==='video'?await loadSrc({url:m.url,name:m.name+' (áudio)',type:'audio'}):m;
      if(used.has(am.id))am=await cloneMedia(am);
      if(!am.peaks){const x=am;blobFromUrl(x.url).then(b=>makePeaks(x,b)).catch(()=>{});}
    }
    used.add(am.id);
    const D=am.dur||1,de=clamp(aiParseT(a.de)??0,0,Math.max(0,D-.1)),ate=clamp(aiParseT(a.ate)??D,de+.1,D);
    const it=newAudio(am,{start:Math.max(0,aiParseT(a.inicio)??0),in:de,out:ate});
    if(a.volume!=null)it.vol=clamp(Number(a.volume)>2?Number(a.volume)/100:Number(a.volume)||0,0,2);
    it.fadeIn=!!a.fadeIn;it.fadeOut=!!a.fadeOut;
    if(a.efeitoAudio)it.afx=aiKey(AFX_N,a.efeitoAudio,x=>x,warn,what+' efeito');
    if(a.reduzirRuido)it.nr=true;
    audios.push(it);
  }

  const POS={topo:-.33,cima:-.33,meio:0,centro:0,baixo:.3,embaixo:.3};
  const texts=[];
  for(const [i,t] of (R.textos||[]).entries()){
    const what=`Texto ${i+1}`;if(!t.texto){warn.push(`${what}: sem texto.`);continue;}
    const ex={text:String(t.texto),start:Math.max(0,aiParseT(t.inicio)??0),dur:clamp(aiParseT(t.duracao)??3,.2,600)};
    if(t.fonte){const f=FONTS.find(x=>aiNorm(x)===aiNorm(t.fonte));if(f)ex.font=f;else warn.push(`${what}: fonte “${t.fonte}” não existe.`);}
    if(t.tamanho)ex.size=clamp(Number(t.tamanho)||60,10,200);
    if(/^#[0-9a-f]{6}$/i.test(t.cor||''))ex.color=t.cor;
    if(/^#[0-9a-f]{6}$/i.test(t.corContorno||''))ex.strokeColor=t.corContorno;
    if(t.contorno!=null)ex.stroke=clamp(Number(t.contorno)||0,0,20);
    if(t.fundo!=null){ex.bg=!!t.fundo;if(/^#[0-9a-f]{6}$/i.test(t.fundo))ex.bgColor=t.fundo;}
    if(t.posicao&&POS[aiNorm(t.posicao)]!==undefined)ex.y=POS[aiNorm(t.posicao)];
    if(t.x!=null)ex.x=clamp(Number(t.x)||0,-.5,.5);
    if(t.y!=null)ex.y=clamp(Number(t.y)||0,-.5,.5);
    if(t.animacao)ex.anim=aiAnim(t.animacao,warn,what);
    texts.push(newText(ex));
  }

  if(!clips.length&&!audios.length&&!texts.length&&R.proporcao==null&&R.silenciarClipes==null)
    throw new Error(warn.length?warn.join('\n'):'A receita veio vazia.');

  commit();
  if(add){S.clips.push(...clips);S.audios.push(...audios);S.texts.push(...texts);}
  else{
    if(R.clipes)S.clips=clips;
    if(R.audios)S.audios=audios;
    if(R.textos)S.texts=texts;
  }
  if(R.proporcao&&RATIOS[R.proporcao])applyRatio(R.proporcao);else if(R.proporcao)warn.push(`Proporção “${R.proporcao}” não existe.`);
  if(R.silenciarClipes!=null)S.muteMain=!!R.silenciarClipes;
  S.sel=null;renderTL();renderTools();seek(0);needDraw=true;
  return {warn,n:`${clips.length} clipe${clips.length===1?'':'s'}, ${audios.length} áudio${audios.length===1?'':'s'}, ${texts.length} texto${texts.length===1?'':'s'}`};
}

function openAI(){
  const hasM=media.size>0;
  sheet('Claude',`<div class="bigBtns"><button data-a="copy"${hasM?'':' disabled'}>${svg(ICON.dup)}Copiar para o Claude</button><button data-a="paste">${svg(ICON.claude)}Colar do Claude</button></div>
    <label class="aiChk"><input type="checkbox" id="aiSil" checked>Medir pausas de fala (vídeos até 3 min)</label>
    <textarea id="aiTxt" rows="5" placeholder="Cole aqui a resposta do Claude com a receita"></textarea>
    <button class="priBtn" id="aiGo">Aplicar receita</button>
    <div class="aiMsg" id="aiMsg">${hasM?'1. Copie e mande no chat do Claude com o seu pedido.\n2. Cole a resposta aqui e toque em Aplicar.\nSe não gostar, é só Desfazer.':'Adicione seus vídeos, fotos e músicas primeiro. A receita só usa mídias que já estão no editor.'}</div>`,b=>{
    const ta=b.querySelector('#aiTxt'),msg=b.querySelector('#aiMsg');
    const say=(t,w)=>{msg.textContent=t;msg.classList.toggle('warn',!!w);};
    b.querySelector('[data-a=copy]').onclick=async()=>{
      say(b.querySelector('#aiSil').checked?'Medindo pausas e montando o resumo…':'Montando o resumo…');
      const txt=await aiSummary(b.querySelector('#aiSil').checked);
      try{await navigator.clipboard.writeText(txt);say('Copiado! Cole no chat do Claude e escreva o pedido depois de “PEDIDO:”.');toast('Copiado para o Claude');}
      catch(e){ta.value=txt;ta.focus();ta.select();say('Não consegui copiar sozinho. O resumo está na caixa: segure, selecione tudo e copie. Depois apague a caixa para colar a resposta.',true);}
    };
    b.querySelector('[data-a=paste]').onclick=async()=>{
      try{const t=await navigator.clipboard.readText();if(t){ta.value=t;say('Colado. Toque em Aplicar receita.');}else throw 0;}
      catch(e){ta.focus();say('Segure dentro da caixa e escolha Colar.',true);}
    };
    b.querySelector('#aiGo').onclick=async()=>{
      if(!ta.value.trim())return say('Cole a receita na caixa primeiro.',true);
      say('Aplicando…');
      try{
        const r=await aiApply(ta.value);
        toast('Receita aplicada: '+r.n);
        if(r.warn.length)say('Aplicada ('+r.n+'), com avisos:\n• '+r.warn.join('\n• ')+'\n\nVocê pode mandar esses avisos para o Claude.',true);
        else{ta.value='';closeSheet();}
      }catch(e){say(e.message||'Não deu para aplicar.',true);}
    };
  });
}
ACT.claude=openAI;

applyRatio('9:16');updRes();updPlay();renderTools();renderTL();updUR();
/* ================= receber da Biblioteca =================
   modo 'fim': vídeo/foto no fim da faixa principal. modo 'camada': por cima, no cursor.
   Áudio (voz, música) sempre entra na faixa de áudio, no cursor. */
let bibBusy=false;
async function addFromBib(ids,modo){
  if(exporting)return -1;
  while(bibBusy)await new Promise(r=>setTimeout(r,150));
  bibBusy=true;let n=0,firstStart=null;
  try{
    for(const id of ids){
      try{
        const r=await TamakiBib.ler(id);if(!r||!r.blob)continue;
        const f=new File([r.blob],(r.nome||'gravacao')+'.'+((r.mime||'').split('/')[1]||'bin'),{type:r.mime});
        const m=await loadMedia(f);commit();
        if(m.type==='audio'){const a=newAudio(m);S.audios.push(a);makePeaks(m,f);if(firstStart===null)firstStart=a.start;}
        else if(modo==='efeito'||r.fundo){const o=newVisual(m,efeitoExtra(r.fundo));S.ovs.push(o);if(m.type==='video')makeThumbs(m);if(firstStart===null)firstStart=o.start;}
        else if(modo==='camada'){const o=newVisual(m,{start:S.t,tf:{x:0,y:0,s:.5,r:0}});S.ovs.push(o);if(m.type==='video')makeThumbs(m);if(firstStart===null)firstStart=o.start;}
        else{const st=videoEnd();S.clips.push(newVisual(m,{tr:{type:'none',dur:.5}}));if(m.type==='video')makeThumbs(m);if(firstStart===null)firstStart=st;}
        n++;
      }catch(e){}
    }
  }finally{bibBusy=false;}
  if(n){select(null);if(firstStart!==null)seek(firstStart);}
  renderTL();renderTools();needDraw=true;updateTime();
  return n;
}
const msgBib=n=>n<0?'O Editor está exportando agora':n?(n===1?'Chegou 1 item da Biblioteca':`Chegaram ${n} itens da Biblioteca`):'Não encontrei o item na Biblioteca';
/* ================= recebidos da aba Efeitos =================
   A aba Efeitos põe sons e efeitos na caixa comum (IndexedDB "tamaki-caixa").
   Efeito com fundo verde entra com chroma key; com fundo preto, mesclado em Tela. */
const efeitoExtra=f=>Object.assign({start:S.t,tf:{x:0,y:0,s:1,r:0}},f==='verde'?{chroma:{on:true,color:'#00B140',tol:.4}}:f==='preto'?{blend:'screen'}:{});
function caixa(modo,fn){return new Promise((ok,no)=>{const r=indexedDB.open('tamaki-caixa',1);r.onupgradeneeded=()=>r.result.createObjectStore('itens',{keyPath:'id'});
  r.onerror=()=>no(r.error);r.onsuccess=()=>{const db=r.result,t=db.transaction('itens',modo),q=fn(t.objectStore('itens'));t.oncomplete=()=>{ok(q&&q.result);db.close();};t.onerror=()=>no(t.error);};});}
let vistos=new Set();try{vistos=new Set(JSON.parse(localStorage.getItem('tamaki-editor-vistos')||'[]'));}catch(_){}
const guardaVistos=()=>{try{localStorage.setItem('tamaki-editor-vistos',JSON.stringify([...vistos].slice(-300)));}catch(_){}};
async function usarRecebido(it){
  if(exporting)return toast('Espere a exportação terminar');
  const tipo=it.tipo==='audio'?'audio':it.tipo==='imagem'?'image':'video',f=new File([it.blob],it.nome+'.'+((it.mime||'').split('/')[1]||'bin').split(';')[0],{type:it.mime||it.blob.type});
  const m=await loadMedia(f,tipo);commit();
  if(tipo==='audio'){S.audios.push(newAudio(m));makePeaks(m,f);}
  else{const o=newVisual(m,efeitoExtra(it.fundo));if(tipo==='image')o.out=3;S.ovs.push(o);S.sel={kind:'ov',id:o.id};if(tipo==='video')makeThumbs(m);}
  vistos.add(it.id);guardaVistos();renderTL();renderTools();needDraw=true;updateTime();
  toast(`“${it.nome}” entrou no cursor`+(it.fundo==='verde'?', com chroma key':it.fundo==='preto'?', mesclado em Tela':''));
}
async function abrirRecebidos(){
  let L=[];try{L=((await caixa('readonly',s=>s.getAll()))||[]).sort((a,b)=>b.criado-a.criado);}catch(_){}
  const ic=t=>t==='audio'?'🔊':t==='imagem'?'🖼️':'🎬',dur=d=>d?' · '+d.toFixed(1)+' s':'';
  sheet('Recebidos',L.length?'<div class="rcb">'+L.map(it=>`<div class="rc" data-id="${esc(it.id)}"><span class="ri">${ic(it.tipo)}</span><span class="rt"><b>${esc(it.nome)}</b><small>${it.tipo}${dur(it.dur)}${it.fundo?' · fundo '+esc(it.fundo):''}${vistos.has(it.id)?'':' · <em>novo</em>'}</small></span><button class="chip on" data-a="usar">＋ Usar</button><button class="chip" data-a="tirar" aria-label="Tirar da caixa">✕</button></div>`).join('')+'</div>'+hint('Entra no cursor. Efeito com fundo verde já vem com chroma key; com fundo preto, mesclado em Tela.')
    :hint('Nada recebido ainda. Na aba 🎧 Efeitos, toque em 📤 Enviar ao editor.'),b=>{
    b.onclick=async e=>{const bt=e.target.closest('[data-a]'),row=e.target.closest('[data-id]');if(!bt||!row)return;const it=L.find(x=>x.id===row.dataset.id);if(!it)return;
      if(bt.dataset.a==='usar'){closeSheet();try{await usarRecebido(it);}catch(err){toast('Não deu para abrir “'+it.nome+'”');}}
      else{await caixa('readwrite',s=>s.delete(it.id));abrirRecebidos();}};
  });
}
ACT.recebidos=abrirRecebidos;
addEventListener('storage',e=>{if(e.key==='tamaki-caixa-aviso')toast('📥 Chegou um efeito: toque em Recebidos');});

/* pelo endereço: editor.html?bib=id1,id2&modo=fim */
(async()=>{
  const q=new URLSearchParams(location.search),ids=(q.get('bib')||'').split(',').filter(Boolean);if(!ids.length)return;
  history.replaceState(null,'',location.pathname);toast('Trazendo da Biblioteca…');
  toast(msgBib(await addFromBib(ids,q.get('modo')||'fim')));
})();
/* direto, com o Editor já aberto em outra aba da Central */
const ED_ID='ed'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
try{
  const bc=new BroadcastChannel('tamaki-editor');
  bc.onmessage=async e=>{
    const d=e.data||{};
    if(d.tipo==='ping')bc.postMessage({tipo:'pong',id:ED_ID,de:d.de,itens:S.clips.length+S.ovs.length+S.texts.length+S.audios.length,exportando:!!exporting});
    else if(d.tipo==='add'&&d.para===ED_ID){toast('Recebendo da Biblioteca…');const n=await addFromBib(d.ids||[],d.modo);toast(msgBib(n));bc.postMessage({tipo:'ok',para:d.de,n});}
  };
}catch(_){}
