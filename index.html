<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141428">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Emulador Retro</title>
<style>
  :root { --bg:#141428; --card:#1f1f3d; --accent:#7a7aff; --text:#f0f0ff; --muted:#9a9ac0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #menu { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  h1 { margin: 0; font-size: 1.8rem; }
  p { margin: 0; color: var(--muted); max-width: 420px; line-height: 1.5; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 14px;
    padding: 16px 28px; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
  .btn:active { transform: scale(.97); }
  .systems { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .chip { background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: .85rem; color: var(--muted); }
  #wrap { position: fixed; inset: 0; display: none; background: #000; overflow: hidden; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; }
  #game .ejs_parent, #game .ejs_game { width: 100% !important; height: 100% !important; }
  #game canvas { max-width: 100%; max-height: 100%; }
  #safe { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); right: 8px; z-index: 9999;
    display: none; background: rgba(0,0,0,.55); color: #fff; border: 0; border-radius: 10px;
    padding: 8px 12px; font-size: .9rem; }
  #back { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 8px; z-index: 9999;
    display: none; background: rgba(0,0,0,.55); color: #fff; border: 0; border-radius: 10px;
    padding: 8px 12px; font-size: .9rem; }
  #err { color: #ff8a8a; min-height: 1.2em; }
</style>
</head>
<body>
<div id="menu">
  <h1>🎮 Emulador Retro</h1>
  <div class="systems">
    <span class="chip">Mega Drive</span>
    <span class="chip">Game Boy Advance</span>
  </div>
  <p>Escolha o arquivo de um jogo seu (.md, .gen, .smd, .bin ou .gba). O sistema é detectado pela extensão.</p>
  <button class="btn" id="open">Abrir jogo</button>
  <input type="file" id="file" accept=".md,.gen,.smd,.bin,.gba,.zip" hidden>
  <div id="err"></div>
  <p style="font-size:.75rem">versão 4</p>
  <p style="font-size:.8rem">Salvar/carregar estado e controles de toque ficam no menu do emulador. Use apenas ROMs que você tem direito de usar.</p>
</div>
<button id="back">⟵ Trocar jogo</button>
<button id="safe">Sem imagem? Modo compatível</button>
<div id="wrap"><div id="game"></div></div>

<script>
const CORES = { md: "segaMD", gen: "segaMD", smd: "segaMD", bin: "segaMD", gba: "gba" };

const fileInput = document.getElementById("file");
document.getElementById("open").onclick = () => fileInput.click();
document.getElementById("back").onclick = () => { location.href = location.pathname; };
const SAFE = new URLSearchParams(location.search).has("safe");
document.getElementById("safe").onclick = () => { location.href = location.pathname + (SAFE ? "" : "?safe=1"); };
if (SAFE) document.getElementById("safe").textContent = "Voltar ao modo normal";

// Lê os nomes dentro de um .zip para descobrir se é Mega Drive ou GBA
async function extsInZip(file) {
  try {
    const tailSize = Math.min(file.size, 70000);
    const tail = new DataView(await file.slice(file.size - tailSize).arrayBuffer());
    let eocd = -1;
    for (let i = tail.byteLength - 22; i >= 0; i--) {
      if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) return [];
    const cdSize = tail.getUint32(eocd + 12, true);
    const cdOff = tail.getUint32(eocd + 16, true);
    const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer());
    const dec = new TextDecoder();
    const exts = [];
    let p = 0;
    while (p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50) {
      const n = cd.getUint16(p + 28, true), m = cd.getUint16(p + 30, true), k = cd.getUint16(p + 32, true);
      const name = dec.decode(new Uint8Array(cd.buffer, p + 46, n));
      exts.push(name.split(".").pop().toLowerCase());
      p += 46 + n + m + k;
    }
    return exts;
  } catch (e) { return []; }
}

fileInput.onchange = async () => {
  const f = fileInput.files[0];
  if (!f) return;
  let ext = f.name.split(".").pop().toLowerCase();
  if (ext === "zip") {
    const inside = await extsInZip(f);
    ext = inside.find((x) => CORES[x]) || "";
  }
  const core = CORES[ext];
  if (!core) { document.getElementById("err").textContent = "Não reconheci o sistema desse arquivo."; return; }

  document.getElementById("menu").style.display = "none";
  document.getElementById("wrap").style.display = "block";
  document.getElementById("back").style.display = "block";
  document.getElementById("safe").style.display = "block";

  window.EJS_player = "#game";
  window.EJS_core = core;
  window.EJS_gameUrl = URL.createObjectURL(f);
  window.EJS_gameName = f.name.replace(/\.[^.]+$/, "");
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded = true;
  window.EJS_color = "#7a7aff";
  window.EJS_language = "pt-BR";
  window.EJS_defaultOptions = SAFE
    ? { shader: "disabled", webgl2Enabled: "disabled", vsync: "disabled" }
    : { shader: "disabled" };
  if (SAFE) window.EJS_threads = false;

  const s = document.createElement("script");
  s.src = window.EJS_pathtodata + "loader.js";
  document.body.appendChild(s);
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
