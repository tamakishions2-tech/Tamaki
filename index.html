<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15181d">
<title>Universo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{--bg:#15181d;--sf:#1d2128;--ln:#2c323c;--tx:#eae3d6;--mt:#9a968c;--bd:#721c28;--go:#b88a3b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--ln)}
h1{margin:0 0 10px;font:600 26px/1.1 Georgia,"Times New Roman",serif;color:var(--go)}
input,select,textarea,button{font:inherit;color:var(--tx)}
#q{width:100%;padding:11px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:10px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--ln);background:none;cursor:pointer}
.chip.on{background:var(--bd);border-color:var(--bd)}
main{padding:14px 16px 96px;max-width:760px;margin:0 auto}
.card{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--ln);border-left:3px solid var(--bd);border-radius:6px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card b{display:block;font:600 18px/1.3 Georgia,serif}
.card small{color:var(--go)}
.card p{margin:4px 0 0;color:var(--mt);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--mt);text-align:center;padding:48px 12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
.fab button{border:0;border-radius:99px;padding:13px 20px;background:var(--go);color:#15181d;font-weight:600;box-shadow:0 4px 14px #0008;cursor:pointer}
.fab .sec{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
dialog{width:min(680px,100% - 20px);max-height:92vh;margin:auto;padding:16px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px}
dialog::backdrop{background:#000b}
dialog input,dialog select,dialog textarea{width:100%;margin-bottom:10px;padding:10px 12px;background:var(--sf);border:1px solid var(--ln);border-radius:8px}
#tt{font:600 20px Georgia,serif}
#tx{min-height:46vh;resize:vertical;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);cursor:pointer}
.row .ok{background:var(--bd);border-color:var(--bd)}
.row .del{color:#e07a7a}
#st{position:fixed;left:0;right:0;bottom:80px;text-align:center;color:var(--mt);font-size:13px;pointer-events:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--go);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Universo</h1>
  <input id="q" type="search" placeholder="Buscar em tudo" aria-label="Buscar">
  <div id="chips"></div>
</header>
<main id="list"></main>
<div id="st"></div>
<div class="fab">
  <button class="sec" id="more">Mais</button>
  <button id="add">Novo texto</button>
</div>

<dialog id="ed">
  <input id="tt" placeholder="Título" aria-label="Título">
  <select id="ct" aria-label="Categoria"></select>
  <textarea id="tx" placeholder="Escreva aqui" aria-label="Texto"></textarea>
  <div class="row">
    <button class="ok" id="sv">Salvar</button>
    <button id="cl">Fechar</button>
    <button class="del" id="dl">Excluir</button>
  </div>
</dialog>

<dialog id="mn">
  <div class="row" style="flex-direction:column">
    <button id="imp">Importar arquivo Word (.docx)</button>
    <button id="exp">Baixar backup (.json)</button>
    <button id="rst">Restaurar backup (.json)</button>
    <button onclick="location.href='gerador.html'">Abrir gerador de OCs</button>
    <button onclick="mn.close()">Fechar</button>
  </div>
  <input type="file" id="fi" hidden>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" defer></script>
<script>
/* ===== COLE AQUI sua configuração do Firebase (opcional) =====
   Sem ela, tudo fica salvo só neste aparelho. */
const CFG={apiKey:"",authDomain:"",projectId:"",appId:""};
const COL="universo";
const CATS=["Mundo","Facções","Personagens","Histórias","Notas"];
const $=id=>document.getElementById(id);
const LS="universo-itens";
let items=[],cat="Todos",db=null,cur=null;

function load(){try{items=JSON.parse(localStorage.getItem(LS))||[]}catch(e){items=[]}}
function keep(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}}
function msg(t){$("st").textContent=t;setTimeout(()=>{if($("st").textContent===t)$("st").textContent=""},2500)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function put(it){
  const i=items.findIndex(x=>x.id===it.id);
  if(i<0)items.push(it);else items[i]=it;
  keep();render();
  if(db)db.collection(COL).doc(it.id).set(it).catch(()=>msg("Salvo só neste aparelho"));
}
function remove(id){
  items=items.filter(x=>x.id!==id);keep();render();
  if(db)db.collection(COL).doc(id).delete().catch(()=>{});
}

function render(){
  const chips=$("chips");chips.innerHTML="";
  ["Todos",...CATS].forEach(c=>{
    const b=document.createElement("button");
    b.className="chip"+(c===cat?" on":"");b.textContent=c;
    b.onclick=()=>{cat=c;render()};chips.appendChild(b);
  });
  const q=$("q").value.trim().toLowerCase();
  const rows=items
    .filter(x=>(cat==="Todos"||x.cat===cat)&&(!q||(x.title+" "+x.text).toLowerCase().includes(q)))
    .sort((a,b)=>(b.ts||0)-(a.ts||0));
  const L=$("list");L.innerHTML="";
  if(!rows.length){
    const d=document.createElement("div");d.className="empty";
    d.textContent=items.length?"Nada encontrado.":"Ainda não há textos. Toque em Novo texto ou importe um arquivo Word.";
    L.appendChild(d);return;
  }
  rows.forEach(x=>{
    const b=document.createElement("button");b.className="card";
    const t=document.createElement("b");t.textContent=x.title||"Sem título";
    const s=document.createElement("small");s.textContent=x.cat;
    const p=document.createElement("p");p.textContent=x.text||"";
    b.append(t,s,p);b.onclick=()=>open(x);L.appendChild(b);
  });
}

function open(x){
  cur=x||{id:uid(),title:"",cat:cat==="Todos"?CATS[0]:cat,text:""};
  $("tt").value=cur.title;$("ct").value=cur.cat;$("tx").value=cur.text;
  $("dl").style.display=x?"":"none";
  $("ed").showModal();
}
$("ct").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("add").onclick=()=>open(null);
$("cl").onclick=()=>$("ed").close();
$("sv").onclick=()=>{
  put({id:cur.id,title:$("tt").value.trim()||"Sem título",cat:$("ct").value,text:$("tx").value,ts:Date.now()});
  $("ed").close();msg("Salvo");
};
$("dl").onclick=()=>{if(confirm("Excluir este texto?")){remove(cur.id);$("ed").close()}};
$("q").oninput=render;
$("more").onclick=()=>$("mn").showModal();

let mode="";
$("imp").onclick=()=>{mode="docx";$("fi").accept=".docx";$("fi").click()};
$("rst").onclick=()=>{mode="json";$("fi").accept=".json";$("fi").click()};
$("exp").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,1)],{type:"application/json"}));
  a.download="universo-backup.json";a.click();
};
$("fi").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    if(mode==="docx"){
      const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});
      put({id:uid(),title:f.name.replace(/\.docx$/i,""),cat:cat==="Todos"?CATS[0]:cat,text:r.value.trim(),ts:Date.now()});
      msg("Arquivo importado");
    }else{
      const d=JSON.parse(await f.text());
      if(!Array.isArray(d))throw 0;
      d.forEach(x=>x&&x.id&&put(x));msg("Backup restaurado");
    }
    $("mn").close();
  }catch(err){msg("Não consegui ler esse arquivo")}
};

load();render();
window.addEventListener("load",()=>{
  if(CFG.apiKey&&window.firebase){
    try{
      firebase.initializeApp(CFG);db=firebase.firestore();
      db.collection(COL).onSnapshot(s=>{
        if(s.metadata.hasPendingWrites)return;
        items=s.docs.map(d=>({id:d.id,...d.data()}));keep();render();
      },()=>msg("Sem conexão com o Firebase"));
    }catch(e){msg("Firebase não iniciou")}
  }
});
if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js").catch(()=>{});
</script>
</body>
</html>
